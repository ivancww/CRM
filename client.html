<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVA Portfolio | 客戶專屬保障首頁</title>

    <link rel="manifest" href="manifest-client.json?v=3.5.1">
    <link rel="icon" type="image/png" sizes="192x192" href="clientapp-192.png?v=3.5.1">
    <link rel="apple-touch-icon" sizes="180x180" href="clientapp-192.png?v=3.5.1">
    <meta name="theme-color" content="#060810">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #060810; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-border { border-color: rgba(212, 175, 55, 0.4); }
        .gold-text { color: #D4AF37; }
        .blue-text { color: #38BDF8; }
        .emerald-text { color: #10B981; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body x-data="pwaApp()" x-init="initPwa()">

    <div class="min-h-screen pb-28">
        <!-- 頂部 Header -->
        <header class="p-4 border-b border-slate-800 sticky top-0 bg-[#060810]/95 backdrop-blur-md z-30 space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <img src="clientapp-192.png?v=3.5.1" class="w-8 h-8 object-contain rounded-lg border border-amber-500/30">
                    <div>
                        <span class="font-bold gold-text text-sm block">A.V.A Team Portfolio</span>
                        <p class="text-[10px] text-slate-400">專屬保障管理總纜</p>
                    </div>
                </div>
                <button @click="generateAndDownloadPdf()" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg flex items-center gap-1 active:scale-95 transition-transform">
                    <i class="fa-solid fa-file-pdf"></i> PDF 導出
                </button>
            </div>

            <!-- 頂部總保費統計 (月供自動*12算出總額) -->
            <template x-if="pwaClient">
                <div class="bg-gradient-to-r from-amber-500/10 to-blue-500/10 p-3 rounded-xl border border-amber-500/30 flex justify-between items-center text-xs">
                    <div>
                        <span class="text-[10px] text-slate-400 block" x-text="selectedCompany === '' ? '全單總每年保費 (年繳)' : selectedCompany + ' 每年總保費'"></span>
                        <span class="font-mono text-base font-bold emerald-text" x-text="getTotalAnnualPremiumDisplay()"></span>
                    </div>
                    <div class="text-right border-l border-slate-800 pl-3">
                        <span class="text-[10px] text-slate-400 block">每月折算 (月供 × 12)</span>
                        <span class="font-mono text-xs font-bold gold-text" x-text="getTotalMonthlyEqDisplay()"></span>
                    </div>
                </div>
            </template>

            <!-- 受保人切換 -->
            <template x-if="pwaClient">
                <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800">
                    <span class="text-xs gold-text font-bold whitespace-nowrap"><i class="fa-solid fa-users"></i> 受保人:</span>
                    <select x-model="selectedInsured" class="w-full bg-transparent text-xs text-white font-bold outline-none">
                        <template x-for="name in getAllInsureds()" :key="name">
                            <option :value="name" x-text="name" class="bg-slate-900"></option>
                        </template>
                    </select>
                </div>
            </template>
        </header>

        <!-- 主內容區域 -->
        <main id="pdf-container" class="p-4 max-w-lg mx-auto space-y-6">
            <template x-if="pwaClient">
                <div class="space-y-6">
                    
                    <!-- 1. 主頁：瀑布流總覽 -->
                    <template x-if="selectedCompany === ''">
                        <div class="space-y-6">
                            
                            <!-- 人生保障卡片獨立呈現 -->
                            <div class="space-y-3">
                                <h3 class="text-xs font-bold gold-text"><i class="fa-solid fa-shield-halved"></i> 人生保障總括</h3>
                                <div class="grid grid-cols-2 gap-3 text-center">
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-blue-500 text-left">
                                        <span class="text-[10px] text-slate-400 block">醫療保障總額</span>
                                        <span class="text-base font-black blue-text my-1 block" x-text="getCategorySum('醫療')"></span>
                                    </div>
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-red-500 text-left">
                                        <span class="text-[10px] text-slate-400 block">危疾總保障</span>
                                        <span class="text-base font-black text-red-400 my-1 block" x-text="getCategorySum('危疾')"></span>
                                    </div>
                                    
                                    <!-- 🌟 兩張完全獨立卡片，各自對應 Admin 的「意外身故」與「意外醫療」 🌟 -->
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-amber-500 text-left">
                                        <span class="text-[10px] text-slate-400 block">意外身故保障</span>
                                        <span class="text-base font-black gold-text my-1 block" x-text="getCategorySum('意外身故')"></span>
                                    </div>
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-emerald-500 text-left">
                                        <span class="text-[10px] text-slate-400 block">意外醫療保障</span>
                                        <span class="text-base font-black emerald-text my-1 block" x-text="getCategorySum('意外醫療')"></span>
                                    </div>

                                    <div class="glass-card p-3 rounded-xl border-l-4 border-purple-500 text-left col-span-2">
                                        <span class="text-[10px] text-slate-400 block">人壽保障總額</span>
                                        <span class="text-base font-black text-purple-400 my-1 block" x-text="getCategorySum('人壽')"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- 理財規劃總覽 -->
                            <div class="glass-card p-4 rounded-2xl space-y-2 border-emerald-500/30">
                                <h3 class="text-xs font-bold emerald-text"><i class="fa-solid fa-chart-line"></i> 理財規劃 (退休 / 教育) 總覽</h3>
                                <div class="flex justify-between items-center text-xs bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-slate-300">儲蓄保單預估總價值:</span>
                                    <span class="font-mono emerald-text font-bold text-sm" x-text="'HK$ ' + formatNumber(getRetirePortfolioValue())"></span>
                                </div>
                            </div>

                            <!-- 退休醫療保障總纜 -->
                            <div class="glass-card p-4 rounded-2xl space-y-2 border-blue-500/30">
                                <h3 class="text-xs font-bold blue-text"><i class="fa-solid fa-hospital-user"></i> 退休醫療保障總覽</h3>
                                <div class="flex justify-between items-center text-xs bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-slate-300">退休醫保預估總儲備:</span>
                                    <span class="font-mono blue-text font-bold text-sm" x-text="'HK$ ' + formatNumber(getMedRetirePortfolioValue())"></span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- 2. 保險公司導航頁專用明細 -->
                    <template x-if="selectedCompany !== ''">
                        <div class="space-y-4">
                            
                            <!-- 顯示/隱藏控制面板 -->
                            <div class="glass-card p-3 rounded-2xl border border-blue-500/40 bg-blue-500/5 space-y-2">
                                <div class="flex justify-between items-center border-b border-blue-500/20 pb-1.5">
                                    <span class="text-xs font-bold blue-text"><i class="fa-solid fa-sliders"></i> <span x-text="selectedCompany"></span> 專頁：自訂勾選隱藏項目</span>
                                    <button @click="selectedCompany = ''" class="text-[10px] text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded">返回全部</button>
                                </div>
                                <div class="grid grid-cols-3 gap-1.5 text-[11px]">
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showSa" class="rounded bg-slate-950 border-slate-700">
                                        <span>保額</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showPrem" class="rounded bg-slate-950 border-slate-700">
                                        <span>保費</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showCv" class="rounded bg-slate-950 border-slate-700">
                                        <span>保單價值</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showTerms" class="rounded bg-slate-950 border-slate-700">
                                        <span>供款/保障期</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer col-span-2">
                                        <input type="checkbox" x-model="compDisplayConfig.showFeatures" class="rounded bg-slate-950 border-slate-700">
                                        <span>條款特點說明</span>
                                    </label>
                                </div>
                            </div>

                            <!-- 保單明細卡片 -->
                            <template x-for="(pol, index) in getFilteredPolicies()" :key="index">
                                <div class="space-y-3 p-4 rounded-2xl border border-slate-700 bg-slate-950/40">
                                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                        <div>
                                            <span class="text-white font-bold text-sm block" x-text="pol.insurer"></span>
                                            <div class="flex items-center gap-2 text-[10px] text-slate-400 mt-0.5">
                                                <span>保單號碼: <strong class="text-slate-200" x-text="pol.policyNumber || '--'"></strong></span>
                                                <span>生效日期: <strong class="text-slate-200" x-text="pol.commencementDate || '--'"></strong></span>
                                            </div>
                                        </div>
                                        <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20" x-text="'受保人: ' + (pol.insuredPerson || pwaClient.owner)"></span>
                                    </div>

                                    <template x-for="(item, iIndex) in pol.items" :key="iIndex">
                                        <div class="glass-card p-3.5 rounded-xl space-y-2.5 border-l-4" :class="iIndex === 0 ? 'border-l-amber-500 bg-amber-500/5' : 'border-l-blue-500 bg-slate-900/60'">
                                            <div class="flex justify-between items-center">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-amber-300" x-text="iIndex === 0 ? '⭐ 主險' : '➕ 附加契約'"></span>
                                                    <span class="font-bold blue-text text-xs" x-text="item.name || '未命名保障'"></span>
                                                </div>
                                                <span class="text-[10px] font-semibold text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded" x-text="item.category"></span>
                                            </div>

                                            <!-- 保單價值 -->
                                            <template x-if="compDisplayConfig.showCv && iIndex === 0 && getItemCvHkd(item) > 0">
                                                <div class="bg-amber-500/10 p-2 rounded-lg border border-amber-500/30 flex justify-between items-center text-xs">
                                                    <span class="gold-text font-bold">預估總保單價值:</span>
                                                    <span class="font-mono gold-text font-bold" x-text="'HK$ ' + formatNumber(getItemCvHkd(item))"></span>
                                                </div>
                                            </template>

                                            <!-- 保額與保費 -->
                                            <template x-if="compDisplayConfig.showSa || compDisplayConfig.showPrem">
                                                <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/60 p-2 rounded-lg border border-slate-800">
                                                    <div x-show="compDisplayConfig.showSa && item.category !== '儲蓄'">
                                                        <span class="text-[10px] text-slate-400 block">保額</span>
                                                        <span class="font-mono gold-text font-bold text-xs" x-text="getDisplayValue(item.sumAssured, item.saCurrency)"></span>
                                                    </div>
                                                    <div x-show="compDisplayConfig.showPrem" :class="item.category === '儲蓄' ? 'col-span-2' : 'col-span-1'">
                                                        <span class="text-[10px] text-slate-400 block" x-text="'保費 (' + (item.payMode || '年繳') + ')'"></span>
                                                        <span class="font-mono text-emerald-400 font-bold text-xs" x-text="getDisplayValue(item.premium, item.currency)"></span>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- 供款期與保障期 -->
                                            <template x-if="compDisplayConfig.showTerms">
                                                <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400 bg-slate-950/40 p-2 rounded-lg">
                                                    <span>供款年期: <strong class="text-slate-200" x-text="item.term || '--'"></strong></span>
                                                    <span>保障年期: <strong class="text-slate-200" x-text="item.maturity || '--'"></strong></span>
                                                </div>
                                            </template>

                                            <!-- 條款特點說明 -->
                                            <template x-if="compDisplayConfig.showFeatures">
                                                <p class="text-[11px] text-slate-300 bg-slate-800/40 p-2.5 rounded-xl border border-slate-800/80 leading-relaxed whitespace-pre-line" x-text="item.features || '沒有特點說明'"></p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                </div>
            </template>
        </main>

        <!-- 底部保險公司導航欄 -->
        <footer x-show="pwaClient" class="fixed bottom-0 left-0 right-0 bg-[#060810]/95 backdrop-blur-md border-t border-slate-800 px-4 py-2.5 z-40">
            <div class="max-w-lg mx-auto flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
                <button @click="selectedCompany = ''" :class="selectedCompany === '' ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'" class="px-3 py-1.5 rounded-xl border text-[11px] font-bold whitespace-nowrap">
                    全部總覽
                </button>
                <template x-for="comp in getCompanyList()" :key="comp">
                    <button @click="selectedCompany = comp" :class="selectedCompany === comp ? 'bg-blue-500/20 text-blue-300 border-blue-500/50' : 'bg-slate-900 text-slate-400 border-slate-800'" class="px-3 py-1.5 rounded-xl border text-[11px] font-bold whitespace-nowrap flex items-center gap-1">
                        <i class="fa-solid fa-building text-[9px]"></i> <span x-text="comp"></span>
                    </button>
                </template>
            </div>
        </footer>
    </div>

    <!-- 註冊 SW -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=3.5.1');
            });
        }
    </script>

    <script>
        const CRM_GAS_URL = "https://script.google.com/macros/s/AKfycbzy1gnDB-qXZIhTsgxNvLveRrHWVP7AoYoqG_JsbELBvvReXy4Fx2rYu6ieJNuupMtmdg/exec";

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === "") return "0";
            return parseFloat(num).toLocaleString('zh-HK');
        };
        const parseNumber = (str) => {
            if (!str) return 0;
            if (typeof str === 'number') return str;
            return parseFloat(str.toString().replace(/,/g, ''));
        };

        function pwaApp() {
            return {
                pwaClient: null,
                selectedInsured: '',
                selectedCompany: '',

                compDisplayConfig: {
                    showSa: true,
                    showPrem: true,
                    showCv: true,
                    showTerms: true,
                    showFeatures: true
                },

                initPwa() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const pwaId = urlParams.get('id');
                    if (pwaId) { this.loadPwaData(pwaId); }
                },
                loadPwaData(pwaId) {
                    const localData = localStorage.getItem('PWA_CLIENT_' + pwaId);
                    if (localData) {
                        this.pwaClient = JSON.parse(localData);
                        this.selectedInsured = this.pwaClient.owner;
                    }
                    fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get' }), redirect: "follow" })
                    .then(r => r.json()).then(res => {
                        if (res.status === 'success') {
                            const found = res.data.find(c => String(c.id) === String(pwaId));
                            if (found) {
                                this.pwaClient = found;
                                this.selectedInsured = found.owner;
                                localStorage.setItem('PWA_CLIENT_' + pwaId, JSON.stringify(found));
                            }
                        }
                    });
                },
                generateAndDownloadPdf() {
                    const element = document.getElementById('pdf-container');
                    if (!element) return;
                    const opt = {
                        margin: 0.3,
                        filename: (this.pwaClient ? this.pwaClient.owner : '客戶') + '_保障總攬分析.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#060810' },
                        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                    };
                    html2pdf().set(opt).from(element).save();
                },
                getAllInsureds() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    const names = this.pwaClient.policies.map(p => p.insuredPerson || this.pwaClient.owner).filter(Boolean);
                    names.unshift(this.pwaClient.owner);
                    return [...new Set(names)];
                },
                getCompanyList() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    return [...new Set(this.pwaClient.policies.map(p => p.insurer).filter(Boolean))];
                },
                getFilteredPolicies() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    const targetName = this.selectedInsured || this.pwaClient.owner;
                    return this.pwaClient.policies.filter(pol => {
                        const matchName = (pol.insuredPerson && pol.insuredPerson === targetName) || (!pol.insuredPerson && this.pwaClient.owner === targetName);
                        const matchCompany = !this.selectedCompany || pol.insurer === this.selectedCompany;
                        return matchName && matchCompany;
                    });
                },
                getTotalAnnualPremiumHkd() {
                    let total = 0;
                    this.getFilteredPolicies().forEach(p => {
                        (p.items || []).forEach(item => {
                            let val = parseNumber(item.premium);
                            if (item.payMode === '月供') val = val * 12;
                            if (item.currency === 'USD') val = val * 7.8;
                            total += val;
                        });
                    });
                    return total;
                },
                getTotalAnnualPremiumDisplay() {
                    return 'HK$ ' + formatNumber(this.getTotalAnnualPremiumHkd());
                },
                getTotalMonthlyEqDisplay() {
                    return 'HK$ ' + formatNumber(this.getTotalAnnualPremiumHkd() / 12);
                },
                // 🌟 精準單獨算對應種類（意外身故 / 意外醫療 完全獨立，不跨分類相加） 🌟
                getCategorySum(catName) {
                    let sum = 0;
                    this.getFilteredPolicies().forEach(p => {
                        (p.items || []).forEach(item => {
                            if (item.category === catName) {
                                let val = parseNumber(item.sumAssured || item.premium);
                                if (item.saCurrency === 'USD' || item.currency === 'USD') val = val * 7.8;
                                sum += val;
                            }
                        });
                    });
                    return 'HK$ ' + formatNumber(sum);
                },
                getItemCvHkd(item) {
                    const total = parseNumber(item.cvGuaranteed) + parseNumber(item.cvAnnualBonus) + parseNumber(item.cvCashValue) + parseNumber(item.cvTerminalBonus) + parseNumber(item.cvReversionaryBonus);
                    return item.cvCurrency === 'USD' ? total * 7.8 : total;
                },
                getRetirePortfolioValue() {
                    let total = 0;
                    this.getFilteredPolicies().forEach(p => {
                        if (p.items && p.items[0] && p.items[0].category === '儲蓄' && !p.items[0].isMedRetire) {
                            total += this.getItemCvHkd(p.items[0]);
                        }
                    });
                    return total;
                },
                getMedRetirePortfolioValue() {
                    let total = 0;
                    this.getFilteredPolicies().forEach(p => {
                        if (p.items && p.items[0] && p.items[0].category === '儲蓄' && p.items[0].isMedRetire) {
                            total += this.getItemCvHkd(p.items[0]);
                        }
                    });
                    return total;
                },
                getDisplayValue(amountStr, currency) {
                    const rawVal = parseNumber(amountStr);
                    if (rawVal === 0) return 'HK$ 0';
                    if (currency === 'USD') return 'US$ ' + formatNumber(rawVal) + ' (≈ HK$ ' + formatNumber(rawVal * 7.8) + ')';
                    return 'HK$ ' + formatNumber(rawVal);
                }
            }
        }
    </script>
</body>
</html>
