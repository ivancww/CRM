<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVA Portfolio | 客戶專屬保障首頁</title>

    <link id="dynamic-manifest" rel="manifest" href="manifest-client.json?v=3.6.3">
    <link rel="icon" type="image/png" sizes="192x192" href="clientapp-192.png?v=3.6.3">
    <link rel="apple-touch-icon" sizes="180x180" href="clientapp-192.png?v=3.6.3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000000; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: #000000; border: 1px solid rgba(255, 255, 255, 0.15); }
        .gold-border { border-color: rgba(212, 175, 55, 0.4); }
        .gold-text { color: #D4AF37; }
        .blue-text { color: #38BDF8; }
        .emerald-text { color: #10B981; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body x-data="pwaApp()" x-init="initPwa()">

    <div class="min-h-screen pb-36 bg-black">
        <!-- 頂部功能操作列 -->
        <header class="p-4 border-b border-slate-800 sticky top-0 bg-black/95 backdrop-blur-md z-30 space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <img src="clientapp-192.png?v=3.6.3" class="w-8 h-8 object-contain rounded-lg border border-amber-500/30">
                    <div>
                        <span class="font-bold gold-text text-sm block">A.V.A Team Portfolio</span>
                        <p class="text-[10px] text-slate-400">專屬保障管理總纜</p>
                    </div>
                </div>

                <div class="flex items-center gap-1.5">
                    <template x-if="isAdvisor">
                        <a href="index.html" class="text-xs bg-slate-900 text-slate-300 border border-slate-700 px-2 py-1 rounded-lg flex items-center gap-1">
                            <i class="fa-solid fa-arrow-left text-[10px]"></i> Admin
                        </a>
                    </template>
                    
                    <!-- 🌟 顧問專屬「分享/二維碼」按鈕：客人掃碼進入後自動徹底移除 🌟 -->
                    <template x-if="isAdvisor">
                        <button @click="openQrModal()" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg flex items-center gap-1 active:scale-95 transition-transform">
                            <i class="fa-solid fa-qrcode text-[11px]"></i> 二維碼
                        </button>
                    </template>

                    <button @click="generateAndDownloadPdf()" class="text-xs bg-black text-slate-200 border border-slate-700 px-2 py-1 rounded-lg flex items-center gap-1 active:scale-95 transition-transform">
                        <i class="fa-solid fa-file-pdf text-[10px]"></i> PDF
                    </button>
                </div>
            </div>

            <!-- 受保人切換 -->
            <template x-if="pwaClient">
                <div class="flex items-center gap-2 bg-black p-2 rounded-xl border border-slate-800">
                    <span class="text-xs gold-text font-bold whitespace-nowrap"><i class="fa-solid fa-users"></i> 受保人:</span>
                    <select x-model="selectedInsured" class="w-full bg-transparent text-xs text-white font-bold outline-none">
                        <template x-for="name in getAllInsureds()" :key="name">
                            <option :value="name" x-text="name" class="bg-black text-white"></option>
                        </template>
                    </select>
                </div>
            </template>
        </header>

        <!-- 🌟 專屬二維碼彈窗 (供現場客人掃描) 🌟 -->
        <div x-show="showQrModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
            <div class="glass-card p-6 rounded-2xl max-w-xs w-full space-y-4 border gold-border text-center bg-black">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="font-bold gold-text text-sm"><i class="fa-solid fa-qrcode"></i> 客戶專屬 QR Code</h3>
                    <button @click="showQrModal = false" class="text-slate-400 hover:text-white text-base"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="flex justify-center my-2">
                    <div id="modal-qrcode" class="bg-white p-3 rounded-2xl flex-shrink-0 min-w-[140px] min-h-[140px] flex items-center justify-center shadow-xl"></div>
                </div>

                <p class="text-xs text-slate-300">請客人打開手機相機掃描，即可於自己手機查閱保障總覽。</p>

                <div class="flex gap-2">
                    <button @click="copyClientLink()" class="flex-1 py-2 bg-slate-900 border border-slate-700 text-xs font-bold rounded-xl text-blue-400">複製專屬連結</button>
                    <button @click="showQrModal = false" class="flex-1 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-xl">完成</button>
                </div>
            </div>
        </div>

        <!-- 載入中 / 錯誤防護提示 -->
        <template x-if="!pwaClient && isLoading">
            <div class="p-8 text-center space-y-3 max-w-sm mx-auto my-12 glass-card rounded-2xl border border-slate-800">
                <div class="text-amber-400 text-2xl animate-spin"><i class="fa-solid fa-circle-notch"></i></div>
                <p class="text-xs text-slate-300">正在加載您的專屬保障資料...</p>
            </div>
        </template>

        <template x-if="!pwaClient && !isLoading">
            <div class="p-8 text-center space-y-3 max-w-sm mx-auto my-12 glass-card rounded-2xl border border-red-500/30">
                <div class="text-red-400 text-2xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <p class="text-xs text-slate-200 font-bold">未能讀取客戶資料</p>
                <p class="text-[11px] text-slate-400">請確認是否已透過專屬二維碼開啟，或聯絡您的顧問獲取專屬連結。</p>
            </div>
        </template>

        <!-- 主內容區域 -->
        <main id="pdf-container" x-show="pwaClient" class="p-4 max-w-lg mx-auto space-y-5 bg-black text-white">
            <template x-if="pwaClient">
                <div class="space-y-5">

                    <!-- PDF 固定頁首 -->
                    <div class="border-b border-slate-800 pb-3 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <img src="clientapp-192.png?v=3.6.3" class="w-8 h-8 object-contain rounded-lg border border-amber-500/30">
                            <div>
                                <span class="font-bold gold-text text-sm block">A.V.A Team Portfolio</span>
                                <p class="text-[10px] text-slate-400">專屬保障管理總纜</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20" x-text="'受保人: ' + (selectedInsured || pwaClient.owner)"></span>
                        </div>
                    </div>

                    <!-- 總保費統計 -->
                    <div class="bg-black p-3.5 rounded-xl border border-amber-500/30 flex justify-between items-center text-xs">
                        <div>
                            <span class="text-[10px] text-slate-400 block" x-text="selectedCompany === '' ? '全單總每年保費 (年繳)' : selectedCompany + ' 每年總保費'"></span>
                            <span class="font-mono text-base font-bold emerald-text" x-text="getTotalAnnualPremiumDisplay()"></span>
                        </div>
                        <div class="text-right border-l border-slate-800 pl-3">
                            <span class="text-[10px] text-slate-400 block">每月折算 (月供 × 12)</span>
                            <span class="font-mono text-xs font-bold gold-text" x-text="getTotalMonthlyEqDisplay()"></span>
                        </div>
                    </div>
                    
                    <!-- 1. 主頁：瀑布流總覽 -->
                    <template x-if="selectedCompany === ''">
                        <div class="space-y-5">
                            
                            <!-- 人生保障卡片獨立呈現 -->
                            <div class="space-y-3">
                                <h3 class="text-xs font-bold gold-text"><i class="fa-solid fa-shield-halved"></i> 人生保障總括</h3>
                                <div class="grid grid-cols-2 gap-3 text-center">
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-blue-500 text-left bg-black">
                                        <span class="text-[10px] text-slate-400 block">醫療保障總額</span>
                                        <span class="text-base font-black blue-text my-1 block" x-text="getCategorySum('醫療')"></span>
                                    </div>
                                    
                                    <!-- 危疾卡片 -->
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-red-500 text-left bg-black">
                                        <div class="flex justify-between items-center">
                                            <span class="text-[10px] text-slate-400 block">危疾總保障</span>
                                            <template x-if="hasMultiClaimCi()">
                                                <span class="text-[9px] bg-red-500/20 text-red-300 border border-red-500/40 px-1.5 py-0.5 rounded font-bold">多次賠償</span>
                                            </template>
                                        </div>
                                        <span class="text-base font-black text-red-400 my-1 block" x-text="getCategorySum('危疾')"></span>
                                    </div>
                                    
                                    <!-- 意外身故與意外醫療獨立卡片 -->
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-amber-500 text-left bg-black">
                                        <span class="text-[10px] text-slate-400 block">意外身故保障</span>
                                        <span class="text-base font-black gold-text my-1 block" x-text="getCategorySum('意外身故')"></span>
                                    </div>
                                    <div class="glass-card p-3 rounded-xl border-l-4 border-emerald-500 text-left bg-black">
                                        <span class="text-[10px] text-slate-400 block">意外醫療保障</span>
                                        <span class="text-base font-black emerald-text my-1 block" x-text="getCategorySum('意外醫療')"></span>
                                    </div>

                                    <div class="glass-card p-3 rounded-xl border-l-4 border-purple-500 text-left col-span-2 bg-black">
                                        <span class="text-[10px] text-slate-400 block">人壽保障總額</span>
                                        <span class="text-base font-black text-purple-400 my-1 block" x-text="getCategorySum('人壽')"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- 理財規劃總覽 -->
                            <div class="glass-card p-4 rounded-2xl space-y-2 border-emerald-500/30 bg-black">
                                <h3 class="text-xs font-bold emerald-text"><i class="fa-solid fa-chart-line"></i> 理財規劃 (退休 / 教育) 總覽</h3>
                                <div class="flex justify-between items-center text-xs bg-black p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-slate-300">儲蓄保單預估總價值:</span>
                                    <span class="font-mono emerald-text font-bold text-sm" x-text="'HK$ ' + formatNumber(getRetirePortfolioValue())"></span>
                                </div>
                            </div>

                            <!-- 退休醫療保障總纜 -->
                            <div class="glass-card p-4 rounded-2xl space-y-2 border-blue-500/30 bg-black">
                                <h3 class="text-xs font-bold blue-text"><i class="fa-solid fa-hospital-user"></i> 退休醫療保障總覽</h3>
                                <div class="flex justify-between items-center text-xs bg-black p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-slate-300">退休醫保預估總儲備:</span>
                                    <span class="font-mono blue-text font-bold text-sm" x-text="'HK$ ' + formatNumber(getMedRetirePortfolioValue())"></span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- 2. 保險公司導航頁專用明細 -->
                    <template x-if="selectedCompany !== ''">
                        <div class="space-y-4">
                            
                            <!-- 顯示/隱藏控制面板 -->
                            <div class="no-pdf glass-card p-3 rounded-2xl border border-blue-500/40 bg-black space-y-2">
                                <div class="flex justify-between items-center border-b border-blue-500/20 pb-1.5">
                                    <span class="text-xs font-bold blue-text"><i class="fa-solid fa-sliders"></i> <span x-text="selectedCompany"></span> 專頁：自訂勾選隱藏項目</span>
                                    <button @click="selectedCompany = ''" class="text-[10px] text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded">返回全部</button>
                                </div>
                                <div class="grid grid-cols-3 gap-1.5 text-[11px]">
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showSa" class="rounded bg-black border-slate-700">
                                        <span>保額</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showPrem" class="rounded bg-black border-slate-700">
                                        <span>保費</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showCv" class="rounded bg-black border-slate-700">
                                        <span>保單價值</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                                        <input type="checkbox" x-model="compDisplayConfig.showTerms" class="rounded bg-black border-slate-700">
                                        <span>供款/保障期</span>
                                    </label>
                                    <label class="flex items-center gap-1 text-slate-300 cursor-pointer col-span-2">
                                        <input type="checkbox" x-model="compDisplayConfig.showFeatures" class="rounded bg-black border-slate-700">
                                        <span>條款特點說明</span>
                                    </label>
                                </div>
                            </div>

                            <!-- 保單明細卡片 -->
                            <template x-for="(pol, index) in getFilteredPolicies()" :key="index">
                                <div class="space-y-3 p-4 rounded-2xl border border-slate-800 bg-black">
                                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                        <div>
                                            <span class="text-white font-bold text-sm block" x-text="pol.insurer"></span>
                                            <div class="flex items-center gap-2 text-[10px] text-slate-400 mt-0.5">
                                                <span>保單號碼: <strong class="text-slate-200" x-text="pol.policyNumber || '--'"></strong></span>
                                                <span>生效日期: <strong class="text-slate-200" x-text="pol.commencementDate || '--'"></strong></span>
                                            </div>
                                        </div>
                                        <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20" x-text="'受保人: ' + (pol.insuredPerson || pwaClient.owner)"></span>
                                    </div>

                                    <template x-for="(item, iIndex) in pol.items" :key="iIndex">
                                        <div class="p-3.5 rounded-xl space-y-2.5 border border-slate-800 bg-black border-l-4" :class="iIndex === 0 ? 'border-l-amber-500' : 'border-l-blue-500'">
                                            <div class="flex justify-between items-center">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-900 border border-slate-700 text-amber-300" x-text="iIndex === 0 ? '⭐ 主險' : '➕ 附加契約'"></span>
                                                    <span class="font-bold blue-text text-xs" x-text="item.name || '未命名保障'"></span>
                                                </div>
                                                <div class="flex items-center gap-1">
                                                    <template x-if="item.category === '危疾' && item.isMultiClaim">
                                                        <span class="text-[9px] font-bold text-red-300 bg-red-500/20 border border-red-500/40 px-1 py-0.5 rounded">多次賠償</span>
                                                    </template>
                                                    <span class="text-[10px] font-semibold text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20" x-text="item.category"></span>
                                                </div>
                                            </div>

                                            <!-- 保單價值 -->
                                            <template x-if="compDisplayConfig.showCv && iIndex === 0 && getItemCvHkd(item) > 0">
                                                <div class="bg-black p-2 rounded-lg border border-amber-500/30 flex justify-between items-center text-xs">
                                                    <span class="gold-text font-bold">預估總保單價值:</span>
                                                    <span class="font-mono gold-text font-bold" x-text="'HK$ ' + formatNumber(getItemCvHkd(item))"></span>
                                                </div>
                                            </template>

                                            <!-- 保額與保費 -->
                                            <template x-if="compDisplayConfig.showSa || compDisplayConfig.showPrem">
                                                <div class="grid grid-cols-2 gap-2 text-xs bg-black p-2 rounded-lg border border-slate-800">
                                                    <div x-show="compDisplayConfig.showSa && item.category !== '儲蓄'">
                                                        <span class="text-[10px] text-slate-400 block">保額</span>
                                                        <span class="font-mono gold-text font-bold text-xs" x-text="getDisplayValue(item.sumAssured, item.saCurrency)"></span>
                                                    </div>
                                                    <div x-show="compDisplayConfig.showPrem" :class="item.category === '儲蓄' ? 'col-span-2' : 'col-span-1'">
                                                        <span class="text-[10px] text-slate-400 block" x-text="'保費 (' + (item.payMode || '年繳') + ')'"></span>
                                                        <span class="font-mono text-emerald-400 font-bold text-xs" x-text="getDisplayValue(item.premium, item.currency)"></span>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- 供款期與保障期 -->
                                            <template x-if="compDisplayConfig.showTerms">
                                                <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400 bg-black p-2 rounded-lg border border-slate-900">
                                                    <span>供款年期: <strong class="text-slate-200" x-text="item.term || '--'"></strong></span>
                                                    <span>保障年期: <strong class="text-slate-200" x-text="item.maturity || '--'"></strong></span>
                                                </div>
                                            </template>

                                            <!-- 條款特點說明 -->
                                            <template x-if="compDisplayConfig.showFeatures">
                                                <p class="text-[11px] text-slate-300 bg-black p-2.5 rounded-xl border border-slate-800 leading-relaxed whitespace-pre-line" x-text="item.features || '沒有特點說明'"></p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- 🌟 客人端專屬引導（只在客人手機出現，無任何二維碼） 🌟 -->
                    <template x-if="!isAdvisor">
                        <div class="no-pdf glass-card p-3 rounded-2xl border border-slate-800 bg-black space-y-2 text-[11px] text-slate-300">
                            <template x-if="isAndroid">
                                <div class="flex items-center justify-between">
                                    <span>🤖 將此保障總覽安裝至手機桌面：</span>
                                    <button @click="triggerInstall()" class="bg-amber-500 text-slate-950 px-2.5 py-1 rounded-lg font-bold text-xs">一鍵安裝</button>
                                </div>
                            </template>
                            <template x-if="isIOS">
                                <div class="space-y-1">
                                    <span class="font-bold text-amber-400">🍎 保障總覽保存指引：</span>
                                    <p class="text-slate-400">點擊 Safari 底部的 <i class="fa-solid fa-arrow-up-from-bracket text-blue-400"></i>「分享」➔ 選擇 <i class="fa-regular fa-square-plus text-amber-400"></i>「加入主畫面」隨時查閱。</p>
                                </div>
                            </template>
                        </div>
                    </template>

                </div>
            </template>
        </main>

        <!-- 底部保險公司導航欄 -->
        <footer x-show="pwaClient" class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-md border-t border-slate-800 px-4 py-2.5 z-40">
            <div class="max-w-lg mx-auto flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
                <button @click="selectedCompany = ''" :class="selectedCompany === '' ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' : 'bg-black text-slate-400 border-slate-800'" class="px-3 py-1.5 rounded-xl border text-[11px] font-bold whitespace-nowrap">
                    全部總覽
                </button>
                <template x-for="comp in getCompanyList()" :key="comp">
                    <button @click="selectedCompany = comp" :class="selectedCompany === comp ? 'bg-blue-500/20 text-blue-300 border-blue-500/50' : 'bg-black text-slate-400 border-slate-800'" class="px-3 py-1.5 rounded-xl border text-[11px] font-bold whitespace-nowrap flex items-center gap-1">
                        <i class="fa-solid fa-building text-[9px]"></i> <span x-text="comp"></span>
                    </button>
                </template>
            </div>
        </footer>
    </div>

    <!-- 註冊 SW -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=3.6.3');
            });
        }
    </script>

    <script>
        const CRM_GAS_URL = "https://script.google.com/macros/s/AKfycbzy1gnDB-qXZIhTsgxNvLveRrHWVP7AoYoqG_JsbELBvvReXy4Fx2rYu6ieJNuupMtmdg/exec";

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === "") return "0";
            return parseFloat(num).toLocaleString('zh-HK');
        };
        const parseNumber = (str) => {
            if (!str) return 0;
            if (typeof str === 'number') return str;
            return parseFloat(str.toString().replace(/,/g, ''));
        };

        function pwaApp() {
            return {
                pwaClient: null,
                selectedInsured: '',
                selectedCompany: '',
                isLoading: true,
                isAdvisor: false,
                showQrModal: false,
                isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream,
                isAndroid: /Android/.test(navigator.userAgent),

                compDisplayConfig: {
                    showSa: true,
                    showPrem: true,
                    showCv: true,
                    showTerms: true,
                    showFeatures: true
                },

                initPwa() {
                    const urlParams = new URLSearchParams(window.location.search);
                    let pwaId = urlParams.get('id');
                    const role = urlParams.get('role');
                    const from = urlParams.get('from');

                    // 判斷是否為顧問 Review 端（由 Admin 帶入 role=advisor）
                    this.isAdvisor = (role === 'advisor') && (from !== 'client');

                    if (!pwaId) {
                        pwaId = localStorage.getItem('AVA_LAST_CLIENT_ID');
                    }

                    if (pwaId) {
                        localStorage.setItem('AVA_LAST_CLIENT_ID', pwaId);
                        
                        try {
                            const dynamicStartUrl = window.location.origin + window.location.pathname + '?id=' + pwaId + '&from=client';
                            const manifestData = {
                                "name": "A.V.A Portfolio | 客戶保障總攬",
                                "short_name": "A.V.A Portfolio",
                                "description": "A.V.A Team 專屬客戶個人及家庭保障總攬 App",
                                "start_url": dynamicStartUrl,
                                "display": "standalone",
                                "background_color": "#000000",
                                "theme_color": "#000000",
                                "orientation": "portrait",
                                "icons": [
                                    { "src": "clientapp-192.png?v=3.6.3", "sizes": "192x192", "type": "image/png" },
                                    { "src": "clientapp-512.png?v=3.6.3", "sizes": "512x512", "type": "image/png" }
                                ]
                            };
                            const stringManifest = JSON.stringify(manifestData);
                            const blob = new Blob([stringManifest], {type: 'application/json'});
                            const manifestURL = URL.createObjectURL(blob);
                            const manifestLink = document.getElementById('dynamic-manifest');
                            if (manifestLink) manifestLink.setAttribute('href', manifestURL);
                        } catch(e) { console.warn("Manifest dynamic injection skipped", e); }

                        this.loadPwaData(pwaId);
                    } else {
                        this.isLoading = false;
                    }
                },
                loadPwaData(pwaId) {
                    this.isLoading = true;
                    const localData = localStorage.getItem('PWA_CLIENT_' + pwaId);
                    if (localData) {
                        this.pwaClient = JSON.parse(localData);
                        this.selectedInsured = this.pwaClient.owner;
                        this.isLoading = false;
                    }
                    fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get' }), redirect: "follow" })
                    .then(r => r.json()).then(res => {
                        this.isLoading = false;
                        if (res.status === 'success') {
                            const found = res.data.find(c => String(c.id) === String(pwaId));
                            if (found) {
                                this.pwaClient = found;
                                this.selectedInsured = found.owner;
                                localStorage.setItem('PWA_CLIENT_' + pwaId, JSON.stringify(found));
                                localStorage.setItem('AVA_LAST_CLIENT_ID', String(pwaId));
                            }
                        }
                    }).catch(() => { this.isLoading = false; });
                },

                getClientShareUrl() {
                    if (!this.pwaClient) return '';
                    return window.location.origin + window.location.pathname + '?id=' + this.pwaClient.id + '&from=client';
                },

                openQrModal() {
                    this.showQrModal = true;
                    this.$nextTick(() => {
                        const container = document.getElementById("modal-qrcode");
                        if (container && this.pwaClient) {
                            container.innerHTML = "";
                            const clientUrl = this.getClientShareUrl();
                            new QRCode(container, { text: clientUrl, width: 140, height: 140 });
                        }
                    });
                },

                copyClientLink() {
                    const clientUrl = this.getClientShareUrl();
                    navigator.clipboard.writeText(clientUrl).then(() => {
                        alert('🔗 客戶專屬連結已複製！');
                    }).catch(() => {
                        prompt('請複製以下連結：', clientUrl);
                    });
                },

                triggerInstall() {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(() => {
                            deferredPrompt = null;
                        });
                    } else {
                        alert('請點擊瀏覽器選單選擇「安裝應用程式」或「加到主畫面」。');
                    }
                },

                generateAndDownloadPdf() {
                    const element = document.getElementById('pdf-container');
                    if (!element) return;

                    const noPdfElements = element.querySelectorAll('.no-pdf');
                    noPdfElements.forEach(el => el.style.display = 'none');

                    const clientName = this.pwaClient ? this.pwaClient.owner : '客戶';
                    const fileNamePrefix = this.selectedCompany ? `${clientName}_${this.selectedCompany}` : `${clientName}_全單`;

                    const opt = {
                        margin: [0.3, 0.3, 0.3, 0.3],
                        filename: `${fileNamePrefix}_保障總攬分析.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#000000' },
                        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(element).save().then(() => {
                        noPdfElements.forEach(el => el.style.display = '');
                    });
                },

                getAllInsureds() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    const names = this.pwaClient.policies.map(p => p.insuredPerson || this.pwaClient.owner).filter(Boolean);
                    names.unshift(this.pwaClient.owner);
                    return [...new Set(names)];
                },
                getCompanyList() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    return [...new Set(this.pwaClient.policies.map(p => p.insurer).filter(Boolean))];
                },
                getFilteredPolicies() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    const targetName = this.selectedInsured || this.pwaClient.owner;
                    return this.pwaClient.policies.filter(pol => {
                        const matchName = (pol.insuredPerson && pol.insuredPerson === targetName) || (!pol.insuredPerson && this.pwaClient.owner === targetName);
                        const matchCompany = !this.selectedCompany || pol.insurer === this.selectedCompany;
                        return matchName && matchCompany;
                    });
                },
                getTotalAnnualPremiumHkd() {
                    let total = 0;
                    this.getFilteredPolicies().forEach(p => {
                        (p.items || []).forEach(item => {
                            let val = parseNumber(item.premium);
                            if (item.payMode === '月供') val = val * 12;
                            if (item.currency === 'USD') val = val * 7.8;
                            total += val;
                        });
                    });
                    return total;
                },
                getTotalAnnualPremiumDisplay() {
                    return 'HK$ ' + formatNumber(this.getTotalAnnualPremiumHkd());
                },
                getTotalMonthlyEqDisplay() {
                    return 'HK$ ' + formatNumber(this.getTotalAnnualPremiumHkd() / 12);
                },
                getCategorySum(catName) {
                    let sum = 0;
                    this.getFilteredPolicies().forEach(p => {
                        (p.items || []).forEach(item => {
                            if (item.category === catName) {
                                let val = parseNumber(item.sumAssured || item.premium);
                                if (item.saCurrency === 'USD' || item.currency === 'USD') val = val * 7.8;
                                sum += val;
                            }
                        });
                    });
                    return 'HK$ ' + formatNumber(sum);
                },
                hasMultiClaimCi() {
                    return this.getFilteredPolicies().some(p => 
                        (p.items || []).some(item => item.category === '危疾' && item.isMultiClaim)
                    );
                },
                getItemCvHkd(item) {
                    const total = parseNumber(item.cvGuaranteed) + parseNumber(item.cvAnnualBonus) + parseNumber(item.cvCashValue) + parseNumber(item.cvTerminalBonus) + parseNumber(item.cvReversionaryBonus);
                    return item.cvCurrency === 'USD' ? total * 7.8 : total;
                },
                getRetirePortfolioValue() {
                    let total = 0;
                    this.getFilteredPolicies().forEach(p => {
                        if (p.items && p.items[0] && p.items[0].category === '儲蓄' && !p.items[0].isMedRetire) {
                            total += this.getItemCvHkd(p.items[0]);
                        }
                    });
                    return total;
                },
                getMedRetirePortfolioValue() {
                    let total = 0;
                    this.getFilteredPolicies().forEach(p => {
                        if (p.items && p.items[0] && p.items[0].category === '儲蓄' && p.items[0].isMedRetire) {
                            total += this.getItemCvHkd(p.items[0]);
                        }
                    });
                    return total;
                },
                getDisplayValue(amountStr, currency) {
                    const rawVal = parseNumber(amountStr);
                    if (rawVal === 0) return 'HK$ 0';
                    if (currency === 'USD') return 'US$ ' + formatNumber(rawVal) + ' (≈ HK$ ' + formatNumber(rawVal * 7.8) + ')';
                    return 'HK$ ' + formatNumber(rawVal);
                }
            }
        }
    </script>
</body>
</html>
