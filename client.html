<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVA Portfolio | 客戶專屬保障首頁</title>

    <link rel="manifest" href="manifest-client.json?v=2.5.3">
    <link rel="icon" type="image/png" sizes="192x192" href="clientapp-192.png?v=2.5.3">
    <link rel="apple-touch-icon" sizes="180x180" href="clientapp-192.png?v=2.5.3">
    <meta name="theme-color" content="#060810">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #060810; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-border { border-color: rgba(212, 175, 55, 0.4); }
        .gold-text { color: #D4AF37; }
        .blue-text { color: #38BDF8; }
        .emerald-text { color: #10B981; }
    </style>
</head>
<body x-data="pwaApp()" x-init="initPwa()">

    <div class="min-h-screen pb-12">
        <header class="p-4 border-b border-slate-800 flex items-center justify-between sticky top-0 bg-[#060810]/90 backdrop-blur-md z-30">
            <div class="flex items-center gap-2">
                <img src="clientapp-192.png?v=2.5.3" class="w-8 h-8 object-contain rounded-lg border border-amber-500/30">
                <div>
                    <span class="font-bold gold-text text-sm block">A.V.A Team Portfolio</span>
                    <p class="text-[10px] text-slate-400">專屬保障管理總覽</p>
                </div>
            </div>
            <span class="text-[10px] text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full" x-text="pwaClient ? pwaClient.owner + ' 專頁' : '載入中'"></span>
        </header>

        <main class="p-4 max-w-lg mx-auto space-y-5">
            <template x-if="pwaClient">
                <div class="space-y-5">
                    <!-- 家庭成員選擇 -->
                    <section class="glass-card p-4 rounded-2xl gold-border">
                        <label class="text-xs gold-text font-bold mb-1 block"><i class="fa-solid fa-users"></i> 切換家庭受保人 (Insured)</label>
                        <select x-model="selectedInsured" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold">
                            <template x-for="name in getAllInsureds()" :key="name">
                                <option :value="name" x-text="name"></option>
                            </template>
                        </select>
                    </section>

                    <!-- 保障數據加總卡片 -->
                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="glass-card p-3.5 rounded-xl border-l-4 border-blue-500">
                            <span class="text-[10px] text-slate-400 block">醫療保障總額</span>
                            <span class="text-lg font-black blue-text" x-text="formatDisplaySum('醫療')"></span>
                        </div>
                        <div class="glass-card p-3.5 rounded-xl border-l-4 border-emerald-500">
                            <span class="text-[10px] text-slate-400 block">儲蓄/理財每年保費</span>
                            <span class="text-lg font-black emerald-text" x-text="formatDisplaySum('儲蓄')"></span>
                        </div>
                        <div class="glass-card p-3.5 rounded-xl border-l-4 border-red-500">
                            <span class="text-[10px] text-slate-400 block">危疾總保障</span>
                            <span class="text-lg font-black text-red-400" x-text="formatDisplaySum('危疾')"></span>
                        </div>
                        <div class="glass-card p-3.5 rounded-xl border-l-4 border-purple-500">
                            <span class="text-[10px] text-slate-400 block">人壽保障總額</span>
                            <span class="text-lg font-black text-purple-400" x-text="formatDisplaySum('人壽')"></span>
                        </div>
                    </div>

                    <!-- 保單詳細清單 (獨立卡片列出主險與附加契約) -->
                    <div class="space-y-4">
                        <h3 class="text-xs font-bold gold-text"><i class="fa-solid fa-shield-halved"></i> 保單保障詳情 (<span x-text="getFilteredPolicies().length"></span> 份保單)</h3>
                        <template x-for="(pol, index) in getFilteredPolicies()" :key="index">
                            <div class="space-y-3 p-4 rounded-2xl border border-slate-700 bg-slate-950/40">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <div>
                                        <span class="text-white font-bold text-sm block" x-text="pol.insurer || '保險公司'"></span>
                                        <span class="text-[10px] text-slate-400" x-text="'保單號碼: ' + (pol.policyNumber || '--')"></span>
                                    </div>
                                    <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20" x-text="'受保人: ' + (pol.insuredPerson || pwaClient.owner)"></span>
                                </div>

                                <!-- 主險與附加契約全獨立卡片 -->
                                <template x-for="(item, iIndex) in pol.items" :key="iIndex">
                                    <div class="glass-card p-3.5 rounded-xl space-y-2 border-l-4" :class="iIndex === 0 ? 'border-l-amber-500' : 'border-l-blue-500'">
                                        <div class="flex justify-between items-center">
                                            <div class="flex items-center gap-1.5">
                                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded" :class="iIndex === 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'" x-text="iIndex === 0 ? '⭐ 主險' : '➕ 附加契約'"></span>
                                                <span class="font-bold blue-text text-xs" x-text="item.name || '未命名保障'"></span>
                                            </div>
                                            <span class="font-mono gold-text font-bold text-xs" x-text="getDisplayPremium(item)"></span>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400 bg-slate-950/60 p-2 rounded-lg">
                                            <span>供款期: <strong class="text-slate-200" x-text="item.term || '--'"></strong></span>
                                            <span>保障期: <strong class="text-slate-200" x-text="item.maturity || '--'"></strong></span>
                                        </div>
                                        <p class="text-[11px] text-slate-300 bg-slate-800/40 p-2.5 rounded-xl border border-slate-800/80 leading-relaxed whitespace-pre-line" x-text="item.features || '沒有特點說明'"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </main>
    </div>

    <script>
        const CRM_GAS_URL = "https://script.google.com/macros/s/AKfycbzy1gnDB-qXZIhTsgxNvLveRrHWVP7AoYoqG_JsbELBvvReXy4Fx2rYu6ieJNuupMtmdg/exec";

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === "") return "0";
            return parseFloat(num).toLocaleString('zh-HK');
        };
        const parseNumber = (str) => {
            if (!str) return 0;
            if (typeof str === 'number') return str;
            return parseFloat(str.toString().replace(/,/g, ''));
        };

        function pwaApp() {
            return {
                pwaClient: null,
                selectedInsured: '',

                initPwa() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const pwaId = urlParams.get('id');
                    if (pwaId) {
                        this.loadPwaData(pwaId);
                    } else {
                        alert('無效的客戶連結');
                    }
                },
                loadPwaData(pwaId) {
                    fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get' }), redirect: "follow" })
                    .then(r => r.json())
                    .then(res => {
                        if (res.status === 'success') {
                            this.pwaClient = res.data.find(c => String(c.id) === String(pwaId));
                            if (this.pwaClient) {
                                this.selectedInsured = this.pwaClient.owner;
                            } else {
                                alert('找不到該客戶的保單資料');
                            }
                        }
                    });
                },
                getAllInsureds() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    const names = this.pwaClient.policies.map(p => p.insuredPerson || this.pwaClient.owner).filter(Boolean);
                    names.unshift(this.pwaClient.owner);
                    return [...new Set(names)];
                },
                getFilteredPolicies() {
                    if (!this.pwaClient || !this.pwaClient.policies) return [];
                    const targetName = this.selectedInsured || this.pwaClient.owner;
                    return this.pwaClient.policies.filter(pol => {
                        return (pol.insuredPerson && pol.insuredPerson === targetName) || (!pol.insuredPerson && this.pwaClient.owner === targetName);
                    });
                },
                getDisplayPremium(item) {
                    const rawVal = parseNumber(item.premium);
                    if (item.currency === 'USD') {
                        return 'US$ ' + formatNumber(rawVal) + ' (≈ HK$ ' + formatNumber(rawVal * 7.8) + ')';
                    }
                    return 'HK$ ' + formatNumber(rawVal);
                },
                formatDisplaySum(catType) {
                    if (!this.pwaClient) return 'HK$ 0';
                    const policies = this.getFilteredPolicies();
                    const sum = policies.reduce((acc, pol) => {
                        return acc + pol.items.reduce((itemAcc, item) => {
                            if (item.category === catType) {
                                let val = parseNumber(item.premium || item.sumAssured);
                                if (item.currency === 'USD') val = val * 7.8;
                                return itemAcc + val;
                            }
                            return itemAcc;
                        }, 0);
                    }, 0);
                    return 'HK$ ' + formatNumber(sum);
                }
            }
        }
    </script>
</body>
</html>
