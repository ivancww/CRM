<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVA Team | 尊尚保險管理系統 v2.1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0B0F19; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-border { border-color: rgba(212, 175, 55, 0.4); }
        .gold-text { color: #D4AF37; }
        .blue-text { color: #38BDF8; }
        .emerald-text { color: #10B981; }
    </style>
</head>
<body x-data="app()" x-init="initApp()">

    <!-- ================= 主頁 (Portal) ================= -->
    <div x-show="currentPage === 'portal'" class="min-h-screen flex flex-col justify-center items-center p-6 text-center">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full border gold-border shadow-2xl">
            <!-- ✨ 更新為第二張圖 Apex Vision Alliance (AVA) Logo -->
            <div class="w-24 h-24 mx-auto mb-4 relative flex items-center justify-center bg-slate-900/80 rounded-2xl border border-amber-500/30 p-2">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <path d="M50 10 L85 25 L85 60 L50 90 L15 60 L15 25 Z" fill="#D90429" stroke="#FFD700" stroke-width="3"/>
                    <path d="M50 20 L30 75 L42 75 L50 50 L58 75 L70 75 Z" fill="#FFD700"/>
                    <circle cx="50" cy="45" r="8" fill="#111827"/>
                    <path d="M50 38 L54 52 L46 52 Z" fill="#D90429"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black tracking-wider gold-text mb-1">Apex Vision Alliance</h1>
            <p class="text-xs text-slate-400 mb-6 uppercase tracking-widest">AVA Team CRM v2.1.1</p>

            <button @click="currentPage = 'admin'" class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-gear"></i> 進入後台管理系統
            </button>
        </div>
    </div>

    <!-- ================= 後台管理 (Admin) ================= -->
    <div x-show="currentPage === 'admin'" class="min-h-screen pb-20">
        <header class="sticky top-0 z-40 bg-[#0B0F19]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button @click="currentPage = 'portal'" class="text-slate-400 hover:text-white mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                <span class="font-bold gold-text text-sm">AVA Admin</span>
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">v2.1.1</span>
            </div>
        </header>

        <main class="p-4 max-w-lg mx-auto space-y-6">
            <!-- 客戶選擇 (A-Z 順序) -->
            <section class="glass-card p-4 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold gold-text">👤 選擇 / 新增客戶 (A-Z 順序)</label>
                    <button @click="createNewClient()" class="text-xs text-blue-400 hover:underline">+ 新增客戶</button>
                </div>
                <select x-model="selectedClientId" @change="loadSelectedClient()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="">-- 請選擇客戶 --</option>
                    <template x-for="c in clients" :key="c.id">
                        <option :value="c.id" x-text="(c.owner || '未命名') + ' (' + (c.policies ? c.policies.length : 0) + '份保單)'"></option>
                    </template>
                </select>
            </section>

            <template x-if="currentClient">
                <div class="space-y-6">
                    <!-- 基本資料 -->
                    <section class="glass-card p-4 rounded-2xl space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">客戶姓名 (Owner)</label>
                                <input type="text" x-model="currentClient.owner" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">受保人 (Insured)</label>
                                <input type="text" x-model="currentClient.insured" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            </div>
                        </div>
                    </section>

                    <!-- 🌟 AI 上載 (帶進度條 % + 自動讀取) -->
                    <section class="glass-card p-4 rounded-2xl gold-border bg-amber-500/5">
                        <h3 class="text-xs font-bold gold-text mb-2"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 智能自動讀取文件 (Gemini 3.6 Flash)</h3>
                        <input type="file" @change="uploadAndParse($event)" accept="image/*, application/pdf" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950">
                        
                        <!-- 進度顯示 -->
                        <div x-show="isParsing" class="mt-3 space-y-1">
                            <div class="flex justify-between text-xs text-amber-400 font-bold">
                                <span><i class="fa-solid fa-spinner fa-spin"></i> 正在解析保單中...</span>
                                <span x-text="parseProgress + '%'"></span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-amber-500 h-2 rounded-full transition-all duration-300" :style="'width: ' + parseProgress + '%'"></div>
                            </div>
                        </div>
                    </section>

                    <!-- 保單列表 (可手動輸入 + 下拉選單) -->
                    <section class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold blue-text">📜 保障列表 (<span x-text="currentClient.policies ? currentClient.policies.length : 0"></span>)</h3>
                            <button @click="addEmptyPolicy()" class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg text-blue-400">+ 新增保障</button>
                        </div>

                        <template x-for="(pol, pIndex) in currentClient.policies" :key="pIndex">
                            <div class="glass-card p-4 rounded-2xl space-y-3 relative border-l-4 border-l-blue-500">
                                <button @click="removePolicy(pIndex)" class="absolute top-3 right-3 text-xs text-red-400"><i class="fa-solid fa-trash-can"></i> 刪除</button>

                                <div class="grid grid-cols-2 gap-2 text-xs">
                                    <div>
                                        <label class="text-[10px] text-slate-400">保險公司 (可選/可打)</label>
                                        <input type="text" x-model="pol.insurer" list="inc-list" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                        <datalist id="inc-list">
                                            <template x-for="inc in dbProducts['保險公司名單'] || []">
                                                <option :value="inc"></option>
                                            </template>
                                        </datalist>
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-400">保單編號</label>
                                        <input type="text" x-model="pol.policyNumber" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                    </div>
                                </div>

                                <template x-for="(item, iIndex) in pol.items" :key="iIndex">
                                    <div class="bg-slate-900/60 p-3 rounded-xl space-y-2 border border-slate-800">
                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保障險種</label>
                                                <select x-model="item.category" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                                    <option value="CI">危疾保障 (CI)</option>
                                                    <option value="Life">人壽保障 (Life)</option>
                                                    <option value="Medical">醫療保障 (Medical)</option>
                                                    <option value="Accident">意外保障 (Accident)</option>
                                                    <option value="Savings">儲蓄理財 (Savings)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">產品名稱 (可下拉選單)</label>
                                                <input type="text" x-model="item.name" :list="'prod-list-' + item.category" @change="onProductSelect(item)" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                                
                                                <!-- 對應險種分頁選單 -->
                                                <datalist :id="'prod-list-' + item.category">
                                                    <template x-for="p in getProductListForCategory(item.category)" :key="p.name">
                                                        <option :value="p.name"></option>
                                                    </template>
                                                </datalist>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-3 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保額/總賠償</label>
                                                <input type="number" x-model.number="item.sumAssured" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">供款期</label>
                                                <input type="text" x-model="item.term" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">保障期</label>
                                                <input type="text" x-model="item.maturity" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                            </div>
                                        </div>

                                        <div>
                                            <label class="text-[10px] text-slate-400">產品特點 (可手動修改/自動下拉選擇代入)</label>
                                            <textarea x-model="item.features" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-xs text-slate-300"></textarea>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </section>

                    <!-- 自動上載同步至 Sheet -->
                    <button @click="saveCurrentClient()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-700 font-bold rounded-xl text-xs text-white">
                        💾 儲存並自動同步至 Google Sheet CRM 分頁
                    </button>
                </div>
            </template>
        </main>
    </div>

    <!-- Alpine.js 引擎 -->
    <script>
        const GAS_URL = "YOUR_GAS_DEPLOYMENT_URL_HERE"; // 🌟 請替換為你的 GAS 部署網址

        function app() {
            return {
                currentPage: 'portal',
                clients: [],
                dbProducts: {},
                selectedClientId: '',
                currentClient: null,
                isParsing: false,
                parseProgress: 0,

                initApp() {
                    this.fetchClients();
                    this.fetchProducts();
                },

                fetchClients() {
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get' }) })
                    .then(r => r.json())
                    .then(res => {
                        if (res.status === 'success') {
                            this.clients = res.data || [];
                        } else {
                            alert('讀取客戶失敗: ' + res.message);
                        }
                    })
                    .catch(err => alert('網絡連線失敗: ' + err));
                },

                fetchProducts() {
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getProducts' }) })
                    .then(r => r.json())
                    .then(res => {
                        if (res.status === 'success') this.dbProducts = res.data || {};
                    });
                },

                loadSelectedClient() {
                    const found = this.clients.find(c => String(c.id) === String(this.selectedClientId));
                    this.currentClient = found ? JSON.parse(JSON.stringify(found)) : null;
                },

                createNewClient() {
                    const newId = Date.now().toString();
                    const newC = { id: newId, owner: '新客戶', insured: '', policies: [] };
                    this.clients.unshift(newC);
                    this.selectedClientId = newId;
                    this.loadSelectedClient();
                },

                addEmptyPolicy() {
                    if (!this.currentClient.policies) this.currentClient.policies = [];
                    this.currentClient.policies.push({
                        insurer: 'AIA', policyNumber: '', premium: 0,
                        items: [{ category: 'CI', name: '', sumAssured: 0, term: '', maturity: '', features: '' }]
                    });
                },

                removePolicy(index) {
                    this.currentClient.policies.splice(index, 1);
                },

                getProductListForCategory(cat) {
                    const sheetName = { 'CI': '危疾保險', 'Life': '人壽保險', 'Medical': '醫療保險', 'Accident': '意外保險', 'Savings': '理財險' }[cat];
                    return this.dbProducts[sheetName] || [];
                },

                onProductSelect(item) {
                    const list = this.getProductListForCategory(item.category);
                    const matched = list.find(p => p.name === item.name);
                    if (matched) {
                        item.features = matched.features;
                    }
                },

                uploadAndParse(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    this.isParsing = true;
                    this.parseProgress = 20;

                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        this.parseProgress = 50;
                        const base64Data = ev.target.result.split(',')[1];

                        fetch(GAS_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'parsePolicyDocument',
                                fileData: base64Data,
                                mimeType: file.type
                            })
                        })
                        .then(r => r.json())
                        .then(res => {
                            this.parseProgress = 100;
                            setTimeout(() => { this.isParsing = false; }, 500);

                            if (res.status === 'success' && res.data) {
                                const p = res.data;
                                if (!this.currentClient.policies) this.currentClient.policies = [];

                                const newItem = {
                                    category: p.category || 'CI',
                                    name: p.productName || '',
                                    sumAssured: Number(p.sumAssured) || 0,
                                    term: p.term || '',
                                    maturity: p.maturity || '',
                                    features: p.features || ''
                                };

                                // 自動搜尋選單帶入特點
                                this.onProductSelect(newItem);

                                this.currentClient.policies.push({
                                    insurer: p.insurer || 'AIA',
                                    policyNumber: p.policyNumber || '',
                                    premium: Number(p.premium) || 0,
                                    items: [newItem]
                                });

                                // 自動同步寫入 Google Sheet CRM 分頁
                                this.saveCurrentClient();
                                alert('🎉 保單解析成功！資料已自動寫入 Google Sheet CRM 分頁。');
                            } else {
                                alert('❌ 解析失敗: ' + (res.message || '無法識別文件'));
                            }
                        })
                        .catch(err => {
                            this.isParsing = false;
                            alert('⚠️ 系統錯誤: ' + err);
                        });
                    };

                    reader.readAsDataURL(file);
                },

                saveCurrentClient() {
                    fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'update', payload: this.currentClient })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.status === 'success') {
                            this.fetchClients();
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
