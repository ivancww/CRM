<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVA CRM Admin (v3.6.1)</title>

    <link rel="manifest" href="manifest-admin.json">
    <link rel="icon" type="image/png" sizes="192x192" href="crmlogo-192.png?v=3.6.1">
    <link rel="apple-touch-icon" sizes="180x180" href="crmlogo-180.png?v=3.6.1">
    <meta name="theme-color" content="#0B0F19">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0B0F19; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-border { border-color: rgba(212, 175, 55, 0.4); }
        .gold-text { color: #D4AF37; }
        .blue-text { color: #38BDF8; }
        textarea { resize: none; overflow: hidden; }
    </style>
</head>
<body x-data="app()" x-init="initApp()">

    <div x-show="!isLoggedIn" class="fixed inset-0 z-50 bg-[#0B0F19] flex items-center justify-center p-4">
        <div class="glass-card p-6 rounded-2xl w-full max-w-sm text-center space-y-4 border gold-border">
            <img src="crmlogo-512.png?v=3.6.1" class="w-20 h-20 mx-auto object-contain rounded-xl shadow-lg">
            <h2 class="text-lg font-bold gold-text">AVA CRM Admin 登入</h2>
            <input type="password" x-model="loginPass" @keyup.enter="login()" placeholder="請輸入密碼 (0903)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-white text-sm outline-none">
            <button @click="login()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 font-bold rounded-xl text-slate-950 text-sm shadow-md">登入系統</button>
        </div>
    </div>

    <div x-show="isLoggedIn" class="min-h-screen pb-20">
        <header class="sticky top-0 z-40 bg-[#0B0F19]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="crmlogo-192.png?v=3.6.1" class="w-6 h-6 object-contain rounded">
                <span class="font-bold gold-text text-sm">AVA Admin</span>
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">v3.6.1</span>
            </div>
            <div class="flex items-center gap-2">
                <button @click="fetchClients(true)" class="text-xs text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg hover:bg-amber-500/10">🔄 同步 Sheet</button>
                <button @click="logout()" class="text-xs text-slate-400 border border-slate-700 px-2 py-1 rounded-lg">登出</button>
            </div>
        </header>

        <main class="p-4 max-w-lg mx-auto space-y-6">
            <datalist id="companyList">
                <template x-for="inc in dbProducts['保險公司'] || []" :key="inc">
                    <option :value="inc"></option>
                </template>
            </datalist>

            <section class="glass-card p-4 rounded-2xl space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold gold-text">👤 選擇 / 管理客戶</label>
                    <div class="flex items-center gap-3">
                        <button @click="resetOwner()" class="text-xs text-blue-400 font-bold hover:underline">+ 建立新客戶</button>
                        <button x-show="selectedClientId" @click="deleteCurrentClient()" class="text-xs text-red-400 font-bold hover:underline"><i class="fa-solid fa-trash-can"></i> 刪除此客戶</button>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <select x-model="selectedClientId" @change="loadSelectedClient()" class="col-span-2 w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        <option value="">-- 請選擇客戶 --</option>
                        <template x-for="c in clients" :key="c.id">
                            <option :value="c.id" x-text="(c.owner || '未命名') + ' (' + (c.policies ? c.policies.length : 0) + ' 份)'"></option>
                        </template>
                    </select>
                    <input type="text" x-model="searchOrNameInput" @input="onNameInput()" class="col-span-1 w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white" placeholder="持有人/客戶姓名">
                </div>
            </section>

            <section class="glass-card p-4 rounded-2xl border border-amber-500/30 bg-amber-500/5 space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold gold-text"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 智能解析 (Gemini 3.6 Flash)</h3>
                    <span class="text-[10px] text-amber-400/80">可一次選最多 10 份</span>
                </div>
                <input type="file" @change="uploadAndParseMultiple($event)" multiple accept="image/*, application/pdf" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950">
                <div x-show="isParsing" class="text-xs text-amber-400 font-bold animate-pulse" x-text="parseProgressText"></div>
            </section>

            <template x-if="currentClient">
                <div class="space-y-6">
                    <section class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold blue-text">📜 保障列表 (<span x-text="currentClient.policies ? currentClient.policies.length : 0"></span> 份保單)</h3>
                            <button @click="addEmptyPolicy()" class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg text-blue-400 border border-slate-700">+ 新增保單</button>
                        </div>

                        <template x-for="(pol, pIndex) in currentClient.policies" :key="pIndex">
                            <div class="space-y-4 p-4 rounded-2xl border border-slate-700/80 bg-slate-950/40">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <span class="font-bold gold-text text-xs" x-text="'保單號碼: ' + (pol.policyNumber || '未填寫')"></span>
                                    <div class="flex items-center gap-2">
                                        <button @click="addEmptyItemToPolicy(pol)" class="text-[10px] text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded">+ 加附加契約</button>
                                        <button @click="removePolicy(pIndex)" class="text-xs text-red-400 hover:text-red-300"><i class="fa-solid fa-xmark"></i> 刪除保單</button>
                                    </div>
                                </div>

                                <template x-for="(item, iIndex) in pol.items" :key="iIndex">
                                    <div class="glass-card p-4 rounded-xl space-y-3 relative border-l-4" :class="iIndex === 0 ? 'border-l-amber-500 bg-amber-500/5' : 'border-l-blue-500 bg-slate-900/60'">
                                        <div class="flex justify-between items-center">
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded" :class="iIndex === 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'" x-text="iIndex === 0 ? '⭐ 主險 (可含價值)' : '➕ 附加契約'"></span>
                                            <button @click="removeSingleItem(pol, iIndex)" class="text-xs text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i> 刪除</button>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保單持有人</label>
                                                <input type="text" x-model="pol.policyHolder" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">受保人姓名</label>
                                                <input type="text" x-model="pol.insuredPerson" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-3 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保險公司</label>
                                                <input type="text" list="companyList" x-model="pol.insurer" placeholder="選擇或輸入" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">保單號碼</label>
                                                <input type="text" x-model="pol.policyNumber" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">生效日期</label>
                                                <input type="text" x-model="pol.commencementDate" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保障種類</label>
                                                <select x-model="item.category" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white">
                                                    <option value="危疾">危疾</option>
                                                    <option value="醫療">醫療</option>
                                                    <option value="意外身故">意外身故</option>
                                                    <option value="意外醫療">意外醫療</option>
                                                    <option value="人壽">人壽</option>
                                                    <option value="儲蓄">儲蓄</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">契約/產品名稱</label>
                                                <input type="text" :list="'plist-' + pIndex + '-' + iIndex" x-model="item.name" @change="onProductSelect(item)" placeholder="選擇或輸入" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white">
                                                <datalist :id="'plist-' + pIndex + '-' + iIndex">
                                                    <template x-for="p in getProductListForCategory(item.category)" :key="p.name">
                                                        <option :value="p.name"></option>
                                                    </template>
                                                </datalist>
                                            </div>
                                        </div>

                                        <template x-if="item.category === '醫療'">
                                            <div class="bg-blue-500/10 p-2.5 rounded-xl border border-blue-500/30 space-y-1">
                                                <label class="text-[10px] text-blue-300 font-bold block">🏥 高端醫療自付額 / 墊底費 (Deductible)</label>
                                                <div class="flex items-center gap-1">
                                                    <input type="text" x-model="item.deductible" @blur="formatCurrency(item, 'deductible')" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white text-xs font-mono" placeholder="若無自付額填 0">
                                                    <select x-model="item.dedCurrency" class="bg-slate-900 text-slate-300 border border-slate-700 rounded p-1 w-16 text-[10px]">
                                                        <option value="HKD">HKD</option>
                                                        <option value="USD">USD</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </template>

                                        <template x-if="iIndex === 0 && (item.category === '危疾' || item.category === '儲蓄' || item.category === '人壽')">
                                            <div class="bg-amber-500/10 p-3 rounded-xl border border-amber-500/30 space-y-2">
                                                <div class="flex justify-between items-center border-b border-amber-500/20 pb-1">
                                                    <span class="text-xs font-bold gold-text"><i class="fa-solid fa-coins"></i> 保單價值細項 (主險專屬)</span>
                                                    <select x-model="item.cvCurrency" class="bg-slate-900 text-slate-200 border border-slate-700 rounded px-1.5 py-0.5 text-[10px]">
                                                        <option value="HKD">HKD</option>
                                                        <option value="USD">USD</option>
                                                    </select>
                                                </div>

                                                <div class="grid grid-cols-2 gap-2 text-[10px]">
                                                    <div>
                                                        <span class="text-slate-400 block">可支取保證現金</span>
                                                        <input type="text" x-model="item.cvGuaranteed" @blur="formatCurrency(item, 'cvGuaranteed')" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white font-mono" placeholder="0">
                                                    </div>
                                                    <div>
                                                        <span class="text-slate-400 block">週年紅利</span>
                                                        <input type="text" x-model="item.cvAnnualBonus" @blur="formatCurrency(item, 'cvAnnualBonus')" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white font-mono" placeholder="0">
                                                    </div>
                                                    <div>
                                                        <span class="text-slate-400 block">現金價值</span>
                                                        <input type="text" x-model="item.cvCashValue" @blur="formatCurrency(item, 'cvCashValue')" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white font-mono" placeholder="0">
                                                    </div>
                                                    <div>
                                                        <span class="text-slate-400 block">終期紅利</span>
                                                        <input type="text" x-model="item.cvTerminalBonus" @blur="formatCurrency(item, 'cvTerminalBonus')" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white font-mono" placeholder="0">
                                                    </div>
                                                    <div class="col-span-2">
                                                        <span class="text-slate-400 block">復歸紅利</span>
                                                        <input type="text" x-model="item.cvReversionaryBonus" @blur="formatCurrency(item, 'cvReversionaryBonus')" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white font-mono" placeholder="0">
                                                    </div>
                                                </div>

                                                <div class="flex justify-between items-center pt-1 border-t border-amber-500/20 text-xs">
                                                    <span class="text-slate-300 font-bold">總保單價值:</span>
                                                    <div class="flex items-center gap-2">
                                                        <span class="gold-text font-mono font-bold" x-text="item.showRawCvUsd ? 'US$ ' + formatNumber(calculateTotalCv(item)) : '≈ HK$ ' + formatNumber(calculateTotalCvHkd(item))"></span>
                                                        <template x-if="item.cvCurrency === 'USD'">
                                                            <button @click="item.showRawCvUsd = !item.showRawCvUsd" class="text-[10px] text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded">🔄</button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">
                                            <div x-show="item.category !== '儲蓄'">
                                                <div class="flex justify-between items-center">
                                                    <label class="text-[10px] text-slate-400">保額 (Sum Assured)</label>
                                                    <select x-model="item.saCurrency" class="bg-slate-900 text-slate-300 border border-slate-800 rounded px-1 py-0.5 text-[9px]">
                                                        <option value="HKD">HKD</option>
                                                        <option value="USD">USD</option>
                                                    </select>
                                                </div>
                                                <input type="text" x-model="item.sumAssured" @blur="formatCurrency(item, 'sumAssured')" class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-white font-mono text-xs mt-1" placeholder="0">
                                                <template x-if="item.saCurrency === 'USD'">
                                                    <div class="flex justify-between items-center mt-1 text-[10px]">
                                                        <span class="gold-text font-mono font-bold" x-text="item.showRawSaUsd ? 'US$ ' + (item.sumAssured || '0') : '≈ HK$ ' + getCalculatedHkd(item.sumAssured)"></span>
                                                        <button @click="item.showRawSaUsd = !item.showRawSaUsd" class="text-blue-400">🔄</button>
                                                    </div>
                                                </template>
                                            </div>

                                            <div :class="item.category === '儲蓄' ? 'col-span-2' : 'col-span-1'">
                                                <div class="flex justify-between items-center">
                                                    <div class="flex items-center gap-1">
                                                        <label class="text-[10px] text-slate-400">保費</label>
                                                        <select x-model="item.payMode" class="bg-slate-900 text-amber-400 border border-amber-500/30 rounded px-1 py-0.5 text-[9px]">
                                                            <option value="年繳">年繳</option>
                                                            <option value="月供">月供</option>
                                                        </select>
                                                    </div>
                                                    <select x-model="item.currency" class="bg-slate-900 text-slate-300 border border-slate-800 rounded px-1 py-0.5 text-[9px]">
                                                        <option value="HKD">HKD</option>
                                                        <option value="USD">USD</option>
                                                    </select>
                                                </div>
                                                <input type="text" x-model="item.premium" @blur="formatCurrency(item, 'premium')" class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-white font-mono text-xs mt-1" placeholder="0">
                                                <template x-if="item.currency === 'USD'">
                                                    <div class="flex justify-between items-center mt-1 text-[10px]">
                                                        <span class="gold-text font-mono font-bold" x-text="item.showRawUsd ? 'US$ ' + (item.premium || '0') : '≈ HK$ ' + getCalculatedHkd(item.premium)"></span>
                                                        <button @click="item.showRawUsd = !item.showRawUsd" class="text-blue-400">🔄</button>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">供款年期</label>
                                                <input type="text" x-model="item.term" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">保障年期</label>
                                                <input type="text" x-model="item.maturity" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white">
                                            </div>
                                        </div>

                                        <div>
                                            <div class="flex justify-between items-center mb-1">
                                                <label class="text-[10px] text-slate-400">契約條款特點說明</label>
                                                <template x-if="item.category === '儲蓄'">
                                                    <label class="flex items-center gap-1 text-[10px] text-amber-400 font-bold cursor-pointer">
                                                        <input type="checkbox" x-model="item.isMedRetire" class="rounded bg-slate-900 border-slate-700">
                                                        <span>☑ 歸類為退休醫保</span>
                                                    </label>
                                                </template>
                                                <template x-if="item.category === '危疾'">
                                                    <label class="flex items-center gap-1 text-[10px] text-red-400 font-bold cursor-pointer">
                                                        <input type="checkbox" x-model="item.isMultiClaim" class="rounded bg-slate-900 border-slate-700">
                                                        <span>☑ 設多次賠償</span>
                                                    </label>
                                                </template>
                                            </div>
                                            <textarea x-model="item.features" @input="autoResizeTextarea($el)" x-init="$nextTick(() => autoResizeTextarea($el))" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-xs text-slate-300 leading-relaxed block transition-all" placeholder="特點說明..."></textarea>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </section>

                    <button @click="saveAndReviewClient()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 font-bold rounded-xl text-xs text-slate-950 shadow-lg active:scale-95 transition-transform">
                        💾 儲存並即時進入客戶 Review 頁面 ➔
                    </button>
                </div>
            </template>
        </main>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=3.6.1');
            });
        }
    </script>

    <script>
        const CRM_GAS_URL = "https://script.google.com/macros/s/AKfycbzy1gnDB-qXZIhTsgxNvLveRrHWVP7AoYoqG_JsbELBvvReXy4Fx2rYu6ieJNuupMtmdg/exec";
        const PRODUCTS_GAS_URL = "https://script.google.com/macros/s/AKfycbzJxEthfbtGFhesn9zqKz_14bvLY0Q6uvKVzSr2WM8s1VfCTJXaCg7lhNEwqyAql6hUuQ/exec";
        const AI_GAS_URL = "https://script.google.com/macros/s/AKfycbzPIlJHqcGWDMeJd_Tc_tpDz-r-vVW9lNXBiVXnD2o0ulVNoGkUHy-Ve3rAxnsWh9dhUQ/exec";

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === "") return "0";
            return parseFloat(num).toLocaleString('zh-HK');
        };
        const parseNumber = (str) => {
            if (!str) return 0;
            if (typeof str === 'number') return str;
            return parseFloat(str.toString().replace(/,/g, ''));
        };

        function app() {
            return {
                isLoggedIn: false,
                loginPass: '',
                clients: [],
                dbProducts: {},
                selectedClientId: '',
                searchOrNameInput: '',
                currentClient: null,
                isParsing: false,
                parseProgressText: '',

                initApp() {
                    if (localStorage.getItem('AVA_ADMIN_AUTH') === 'true') {
                        this.isLoggedIn = true;
                        this.fetchClients();
                        this.fetchProducts();
                    }
                },
                login() {
                    if (this.loginPass === '0903') {
                        this.isLoggedIn = true;
                        localStorage.setItem('AVA_ADMIN_AUTH', 'true');
                        this.fetchClients();
                        this.fetchProducts();
                    } else { alert('密碼錯誤！'); }
                },
                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('AVA_ADMIN_AUTH');
                },
                autoResizeTextarea(el) {
                    if (!el) return;
                    el.style.height = 'auto';
                    el.style.height = (el.scrollHeight + 4) + 'px';
                },
                getCalculatedHkd(val) {
                    const parsed = parseNumber(val);
                    return formatNumber(parsed * 7.8);
                },
                calculateTotalCv(item) {
                    return parseNumber(item.cvGuaranteed) + parseNumber(item.cvAnnualBonus) + parseNumber(item.cvCashValue) + parseNumber(item.cvTerminalBonus) + parseNumber(item.cvReversionaryBonus);
                },
                calculateTotalCvHkd(item) {
                    const total = this.calculateTotalCv(item);
                    return item.cvCurrency === 'USD' ? total * 7.8 : total;
                },
                fetchClients(forceSync = false) {
                    const localData = localStorage.getItem('AVA_CLIENTS_CACHE');
                    if (localData && !forceSync) {
                        this.clients = JSON.parse(localData);
                    }
                    fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get' }), redirect: "follow" })
                    .then(r => r.json()).then(res => {
                        if (res.status === 'success') {
                            this.clients = res.data || [];
                            localStorage.setItem('AVA_CLIENTS_CACHE', JSON.stringify(this.clients));
                            if (this.selectedClientId) this.loadSelectedClient();
                        }
                    });
                },
                fetchProducts() {
                    fetch(PRODUCTS_GAS_URL).then(r => r.json()).then(res => { if (res.status === 'success') this.dbProducts = res.data || {}; });
                },
                loadSelectedClient() {
                    const found = this.clients.find(c => String(c.id) === String(this.selectedClientId));
                    if (!found) { this.currentClient = null; return; }
                    const clientCopy = JSON.parse(JSON.stringify(found));
                    clientCopy.policies.forEach(pol => {
                        if (pol.items) {
                            pol.items.forEach(item => {
                                if (!item.payMode) item.payMode = '年繳';
                                if (!item.currency) item.currency = 'HKD';
                                if (!item.saCurrency) item.saCurrency = 'HKD';
                                if (!item.cvCurrency) item.cvCurrency = 'HKD';
                                if (item.isMedRetire === undefined) item.isMedRetire = false;
                                if (item.isMultiClaim === undefined) item.isMultiClaim = false;
                            });
                        }
                    });
                    this.currentClient = clientCopy;
                    this.searchOrNameInput = clientCopy.owner;
                    this.$nextTick(() => { document.querySelectorAll('textarea').forEach(el => this.autoResizeTextarea(el)); });
                },
                onNameInput() {
                    if (this.currentClient) {
                        this.currentClient.owner = this.searchOrNameInput;
                        const target = this.clients.find(c => String(c.id) === String(this.currentClient.id));
                        if (target) target.owner = this.searchOrNameInput;
                    }
                },
                resetOwner() {
                    const newId = Date.now().toString();
                    const newClient = { id: newId, owner: '新客戶', insured: '新客戶', policies: [] };
                    this.clients.unshift(newClient);
                    this.selectedClientId = newId;
                    this.currentClient = newClient;
                    this.searchOrNameInput = '新客戶';
                },
                deleteCurrentClient() {
                    if (!this.selectedClientId) return;
                    if (confirm('確定要刪除？')) {
                        fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: this.selectedClientId }), redirect: "follow" })
                        .then(r => r.json()).then(res => { if (res.status === 'success') { this.selectedClientId = ''; this.currentClient = null; this.fetchClients(true); } });
                    }
                },
                addEmptyPolicy() {
                    if (!this.currentClient.policies) this.currentClient.policies = [];
                    this.currentClient.policies.push({
                        insurer: '', policyNumber: '', commencementDate: '', policyHolder: this.searchOrNameInput, insuredPerson: this.searchOrNameInput,
                        items: [{ category: '危疾', name: '', term: '', maturity: '', sumAssured: "0", saCurrency: 'HKD', premium: "0", payMode: '年繳', currency: 'HKD', cvCurrency: 'HKD', cvGuaranteed: "0", cvAnnualBonus: "0", cvCashValue: "0", cvTerminalBonus: "0", cvReversionaryBonus: "0", isMedRetire: false, isMultiClaim: false, features: '' }]
                    });
                },
                addEmptyItemToPolicy(policy) {
                    if (!policy.items) policy.items = [];
                    policy.items.push({ category: '危疾', name: '', term: '', maturity: '', sumAssured: "0", saCurrency: 'HKD', premium: "0", payMode: '年繳', currency: 'HKD', cvCurrency: 'HKD', cvGuaranteed: "0", cvAnnualBonus: "0", cvCashValue: "0", cvTerminalBonus: "0", cvReversionaryBonus: "0", isMedRetire: false, isMultiClaim: false, features: '' });
                },
                removePolicy(index) { this.currentClient.policies.splice(index, 1); },
                removeSingleItem(policy, itemIndex) { policy.items.splice(itemIndex, 1); },
                getProductListForCategory(cat) { 
                    return this.dbProducts[cat] || []; 
                },
                onProductSelect(item) {
                    const list = this.getProductListForCategory(item.category);
                    const matched = list.find(p => p.name === item.name);
                    if (matched) item.features = matched.features;
                    else if (!item.features) item.features = "（請手動輸入/修改特點）";
                    this.$nextTick(() => { document.querySelectorAll('textarea').forEach(el => this.autoResizeTextarea(el)); });
                },
                formatCurrency(item, field) {
                    if (item[field]) {
                        item[field] = formatNumber(parseNumber(item[field]));
                    }
                },
                async uploadAndParseMultiple(e) {
                    const files = Array.from(e.target.files);
                    if (!files || files.length === 0) return;

                    if (files.length > 10) {
                        alert('⚠️ 一次最多只能選擇 10 份文件，請重新選取！');
                        e.target.value = '';
                        return;
                    }

                    this.isParsing = true;
                    let totalParsedCount = 0;
                    let totalNewPolicies = 0;
                    let totalUpdatedPolicies = 0;

                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        this.parseProgressText = `⏳ 正在解析第 (${i + 1}/${files.length}) 份文件: ${file.name}...`;

                        try {
                            const base64Data = await this.readFileAsBase64(file);
                            const response = await fetch(AI_GAS_URL, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'parsePolicyDocument', fileData: base64Data, mimeType: file.type })
                            });
                            const res = await response.json();

                            if (res.status === 'success' && res.data) {
                                const parsedList = res.data;
                                totalParsedCount += parsedList.length;

                                const detectedHolder = (parsedList[0] && parsedList[0].policyHolder) ? parsedList[0].policyHolder.trim() : '';
                                let targetClient = null;

                                if (detectedHolder) {
                                    const existingClient = this.clients.find(c => c.owner && c.owner.trim() === detectedHolder);
                                    if (existingClient) {
                                        if (this.currentClient && this.currentClient.id === existingClient.id) {
                                            targetClient = this.currentClient;
                                        } else {
                                            const confirmMerge = confirm(`📄 文件【${file.name}】讀取到客戶：【${detectedHolder}】\n\n系統發現客戶名單中已存在【${detectedHolder}】，是否將此保單合併至該客戶名下？\n\n- 點擊「確定」：合併至現有客戶\n- 點擊「取消」：建立新客戶記錄`);
                                            if (confirmMerge) {
                                                this.selectedClientId = existingClient.id;
                                                this.loadSelectedClient();
                                                targetClient = this.currentClient;
                                            }
                                        }
                                    }
                                }

                                if (!targetClient) {
                                    if (!this.currentClient || this.currentClient.owner === '新客戶') {
                                        if (!this.currentClient) this.resetOwner();
                                        if (detectedHolder) {
                                            this.currentClient.owner = detectedHolder;
                                            this.searchOrNameInput = detectedHolder;
                                        }
                                    }
                                    targetClient = this.currentClient;
                                }

                                if (!targetClient.policies) targetClient.policies = [];

                                parsedList.forEach(p => {
                                    const polNum = p.policyNumber || '';
                                    let targetPolicy = targetClient.policies.find(pol => pol.policyNumber && pol.policyNumber === polNum);

                                    const parsedItem = {
                                        category: p.category || '危疾',
                                        name: p.productName || '',
                                        sumAssured: formatNumber(parseNumber(p.sumAssured ? p.sumAssured.amount : 0)),
                                        saCurrency: (p.sumAssured && p.sumAssured.currency) ? p.sumAssured.currency : 'HKD',
                                        premium: formatNumber(parseNumber(p.premium ? p.premium.amount : 0)),
                                        payMode: p.payMode || '年繳',
                                        currency: (p.premium && p.premium.currency) ? p.premium.currency : 'HKD',
                                        deductible: formatNumber(parseNumber(p.deductible ? p.deductible.amount : 0)),
                                        dedCurrency: (p.deductible && p.deductible.currency) ? p.deductible.currency : 'HKD',
                                        cvGuaranteed: formatNumber(parseNumber(p.cvGuaranteed || 0)),
                                        cvAnnualBonus: formatNumber(parseNumber(p.cvAnnualBonus || 0)),
                                        cvCashValue: formatNumber(parseNumber(p.cvCashValue || 0)),
                                        cvTerminalBonus: formatNumber(parseNumber(p.cvTerminalBonus || 0)),
                                        cvReversionaryBonus: formatNumber(parseNumber(p.cvReversionaryBonus || 0)),
                                        cvCurrency: p.cvCurrency || 'HKD',
                                        term: p.term || '',
                                        maturity: p.maturity || '',
                                        isMedRetire: false,
                                        isMultiClaim: false,
                                        features: p.features || ''
                                    };

                                    this.onProductSelect(parsedItem);

                                    if (targetPolicy && polNum !== '') {
                                        totalUpdatedPolicies++;
                                        if (p.insurer) targetPolicy.insurer = p.insurer;
                                        if (p.commencementDate) targetPolicy.commencementDate = p.commencementDate;

                                        let existingItem = targetPolicy.items.find(it => it.name && it.name === parsedItem.name);
                                        if (existingItem) {
                                            Object.assign(existingItem, parsedItem);
                                        } else {
                                            targetPolicy.items.push(parsedItem);
                                        }
                                    } else {
                                        totalNewPolicies++;
                                        targetClient.policies.push({
                                            insurer: p.insurer || '',
                                            policyNumber: polNum,
                                            commencementDate: p.commencementDate || '',
                                            policyHolder: p.policyHolder || targetClient.owner,
                                            insuredPerson: p.insuredPerson || targetClient.owner,
                                            items: [parsedItem]
                                        });
                                    }
                                });
                            }
                        } catch (err) {
                            console.error(`解析檔案 ${file.name} 失敗:`, err);
                        }
                    }

                    this.isParsing = false;
                    this.parseProgressText = '';
                    e.target.value = '';

                    this.$nextTick(() => { document.querySelectorAll('textarea').forEach(el => this.autoResizeTextarea(el)); });
                    alert(`🎉 批次上載完成（共 ${files.length} 份文件）！\n\n- 新增保單：${totalNewPolicies} 份\n- 更新/補充覆蓋：${totalUpdatedPolicies} 份`);
                },

                readFileAsBase64(file) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const cleanBase64 = ev.target.result.split(',')[1].replace(/[\r\n\s]/g, '');
                            resolve(cleanBase64);
                        };
                        reader.onerror = (err) => reject(err);
                        reader.readAsDataURL(file);
                    });
                },

                // 🌟 儲存並即刻跳轉到客戶 Review 頁面 🌟
                saveAndReviewClient() {
                    if (this.currentClient) this.currentClient.owner = this.searchOrNameInput;
                    fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update', payload: this.currentClient }), redirect: "follow" })
                    .then(r => r.json()).then(res => { 
                        if (res.status === 'success') { 
                            // 儲存至本地快取
                            localStorage.setItem('PWA_CLIENT_' + this.currentClient.id, JSON.stringify(this.currentClient));
                            localStorage.setItem('AVA_LAST_CLIENT_ID', String(this.currentClient.id));
                            
                            // 直接進入客戶 Review 頁面
                            const reviewUrl = window.location.href.split('?')[0].replace('index.html', '') + 'client.html?id=' + this.currentClient.id;
                            window.location.href = reviewUrl;
                        } else {
                            alert('儲存失敗：' + res.message);
                        }
                    }).catch(err => {
                        alert('連線失敗：' + err.message);
                    });
                }
            }
        }
    </script>
</body>
