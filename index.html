<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Vision Alliance | AVA CRM v2.1.5 Dual Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B0F19; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-text { color: #D4AF37; }
        .blue-text { color: #38BDF8; }
        .emerald-text { color: #10B981; }
    </style>
</head>
<body x-data="app()" x-init="initApp()">

    <!-- ================= 1. 主頁 (Portal) ================= -->
    <div x-show="currentPage === 'portal'" class="min-h-screen flex flex-col justify-center items-center p-6 text-center">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full border border-amber-500/40 shadow-2xl space-y-4">
            <!-- App Logo (帶快取更新參數) -->
            <div class="w-28 h-28 mx-auto flex items-center justify-center p-1 bg-[#000511] rounded-2xl border border-amber-500/40 shadow-xl overflow-hidden">
                <img src="admin-logo-512.png?v=2.1.5" alt="AVA CRM Logo" class="w-full h-full object-contain">
            </div>

            <h1 class="text-xl font-black gold-text">Apex Vision Alliance</h1>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest">AVA CRM Executive v2.1.5</p>

            <button @click="currentPage = 'admin'" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs">
                <i class="fa-solid fa-user-gear"></i> 進入後台管理系統
            </button>
        </div>
    </div>

    <!-- ================= 2. 後台管理 (Admin) ================= -->
    <div x-show="currentPage === 'admin'" class="min-h-screen pb-20">
        <header class="sticky top-0 z-40 bg-[#0B0F19]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button @click="currentPage = 'portal'" class="text-slate-400 hover:text-white mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                <img src="admin-logo-192.png?v=2.1.5" class="w-6 h-6 object-contain rounded">
                <span class="font-bold gold-text text-sm">AVA Admin</span>
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">v2.1.5</span>
            </div>
            <button @click="initApp()" class="text-xs text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg hover:bg-amber-500/10">
                🔄 同步 Sheet
            </button>
        </header>

        <main class="p-4 max-w-lg mx-auto space-y-6">
            <!-- 客戶選擇 (A-Z) -->
            <section class="glass-card p-4 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold gold-text">👤 選擇 / 新增客戶持有人 (Owner)</label>
                    <button @click="createNewClient()" class="text-xs text-blue-400 hover:underline">+ 新增客戶</button>
                </div>

                <select x-model="selectedClientId" @change="loadSelectedClient()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="">-- 請選擇持有人 --</option>
                    <template x-for="c in clients" :key="c.id">
                        <option :value="c.id" x-text="(c.owner || '未命名') + ' (' + (c.policies ? c.policies.length : 0) + ' 份保單)'"></option>
                    </template>
                </select>
            </section>

            <template x-if="currentClient">
                <div class="space-y-6">
                    <!-- 持有人與家庭受保人切換 -->
                    <section class="glass-card p-4 rounded-2xl space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">保單持有人 (Owner)</label>
                                <input type="text" x-model="currentClient.owner" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">👨‍👩‍👧 切換聚焦受保人 (Insured)</label>
                                <select x-model="selectedInsuredFilter" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2 text-xs gold-text font-bold">
                                    <option value="ALL">全部受保人保單</option>
                                    <template x-for="name in familyInsuredList" :key="name">
                                        <option :value="name" x-text="name"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </section>

                    <!-- AI 智能保單讀取 (獨立引擎 2 處理) -->
                    <section class="glass-card p-4 rounded-2xl border border-amber-500/30 bg-amber-500/5">
                        <h3 class="text-xs font-bold gold-text mb-1"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 自動讀取保單 (Gemini 3.6 Flash)</h3>
                        <p class="text-[10px] text-slate-400 mb-3">上載圖片/PDF，獨立 AI 引擎極速解析並自動寫入 CRM：</p>
                        
                        <input type="file" @change="uploadAndParse($event)" accept="image/*, application/pdf" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400">
                        
                        <div x-show="isParsing" class="mt-2 text-xs text-amber-400 font-bold animate-pulse">
                            <i class="fa-solid fa-spinner fa-spin"></i> AI 引擎 2 正在解析保單中...
                        </div>
                    </section>

                    <!-- 保障列表 (自動相容舊數據與對應 Sheet) -->
                    <section class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold blue-text">📜 保障列表 (<span x-text="filteredPoliciesByInsured.length"></span>)</h3>
                            <button @click="addEmptyPolicy()" class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg text-blue-400 border border-slate-700">+ 新增保障</button>
                        </div>

                        <template x-for="(pol, pIndex) in filteredPoliciesByInsured" :key="pIndex">
                            <div class="glass-card p-4 rounded-2xl space-y-3 relative border-l-4 border-l-blue-500">
                                <button @click="removePolicy(pIndex)" class="absolute top-3 right-3 text-xs text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i> 刪除</button>

                                <div class="grid grid-cols-2 gap-2 text-xs">
                                    <div>
                                        <label class="text-[10px] text-slate-400">保險公司</label>
                                        <select x-model="pol.insurer" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
                                            <option value="">-- 請選擇 --</option>
                                            <template x-for="inc in dbProducts['保險公司名單'] || []">
                                                <option :value="inc" x-text="inc" :selected="inc === pol.insurer"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-400">該保單受保人 (Insured)</label>
                                        <input type="text" x-model="pol.insuredPerson" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white" placeholder="受保人姓名">
                                    </div>
                                </div>

                                <template x-for="(item, iIndex) in pol.items" :key="iIndex">
                                    <div class="bg-slate-900/60 p-3 rounded-xl space-y-2 border border-slate-800">
                                        <div class="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保障險種</label>
                                                <select x-model="item.category" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                                    <option value="CI">危疾保障 (CI)</option>
                                                    <option value="Life">人壽保障 (Life)</option>
                                                    <option value="Medical">醫療保障 (Medical)</option>
                                                    <option value="Accident">意外保障 (Accident)</option>
                                                    <option value="Savings">儲蓄理財 (Savings)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">產品名稱 (連動 Sheet)</label>
                                                <select x-model="item.name" @change="onProductSelect(item)" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                                    <option value="">-- 請選擇產品 --</option>
                                                    <template x-for="p in getProductListForCategory(item.category)" :key="p.name">
                                                        <option :value="p.name" x-text="p.name" :selected="p.name === item.name"></option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-3 gap-2 text-xs">
                                            <div>
                                                <label class="text-[10px] text-slate-400">保額/總賠償</label>
                                                <input type="number" x-model.number="item.sumAssured" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">供款期</label>
                                                <input type="text" x-model="item.term" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400">保障期</label>
                                                <input type="text" x-model="item.maturity" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white">
                                            </div>
                                        </div>

                                        <div>
                                            <label class="text-[10px] text-slate-400">產品特點說明</label>
                                            <textarea x-model="item.features" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-xs text-slate-300"></textarea>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </section>

                    <button @click="saveCurrentClient()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-700 font-bold rounded-xl text-xs text-white shadow-lg">
                        💾 儲存並同步至 Google Sheet CRM
                    </button>
                </div>
            </template>
        </main>
    </div>

    <!-- ================= Alpine.js 雙引擎控制邏輯 ================= -->
    <script>
        // 🌟 引擎 1：CRM 資料庫 GAS Endpoint
        const CRM_GAS_URL = "https://script.google.com/macros/s/AKfycby-1AkUDr7fL8digJDaCRiTliAeWikk8-XsXznXKHvBYQ5nP8vim7iq_N4FR1mp-RHp/exec";

        // 🌟 引擎 2：獨立 AI OCR 保單解析 GAS Endpoint
        const AI_GAS_URL = "https://script.google.com/macros/s/AKfycbzPIlJHqcGWDMeJd_Tc_tpDz-r-vVW9lNXBiVXnD2o0ulVNoGkUHy-Ve3rAxnsWh9dhUQ/exec";

        function app() {
            return {
                currentPage: 'portal',
                clients: [],
                dbProducts: {},
                selectedClientId: '',
                currentClient: null,
                selectedInsuredFilter: 'ALL',
                isParsing: false,

                initApp() {
                    this.fetchClients();
                    this.fetchProducts();
                },

                // 呼叫 CRM Engine 1 (資料庫)
                postToCrm(data) {
                    return fetch(CRM_GAS_URL, { method: 'POST', body: JSON.stringify(data) })
                    .then(r => r.text())
                    .then(text => JSON.parse(text));
                },

                // 呼叫 AI Engine 2 (Gemini 解析)
                postToAi(data) {
                    return fetch(AI_GAS_URL, { method: 'POST', body: JSON.stringify(data) })
                    .then(r => r.text())
                    .then(text => JSON.parse(text));
                },

                fetchClients() {
                    this.postToCrm({ action: 'get' })
                    .then(res => {
                        if (res.status === 'success') {
                            this.clients = res.data || [];
                        }
                    });
                },

                fetchProducts() {
                    this.postToCrm({ action: 'getProducts' })
                    .then(res => {
                        if (res.status === 'success') {
                            this.dbProducts = res.data || {};
                        }
                    });
                },

                loadSelectedClient() {
                    const found = this.clients.find(c => String(c.id) === String(this.selectedClientId));
                    if (!found) {
                        this.currentClient = null;
                        return;
                    }

                    const clientCopy = JSON.parse(JSON.stringify(found));
                    if (clientCopy.policies) {
                        clientCopy.policies.forEach(p => {
                            if (!p.insuredPerson) p.insuredPerson = clientCopy.insured || clientCopy.owner;
                            if (p.items) {
                                p.items.forEach(item => {
                                    if (!item.name && item.productName) item.name = item.productName;
                                    if (!item.features && item.特點) item.features = item.特點;
                                });
                            }
                        });
                    }
                    this.currentClient = clientCopy;
                    this.selectedInsuredFilter = 'ALL';
                },

                get familyInsuredList() {
                    if (!this.currentClient || !this.currentClient.policies) return [];
                    const names = this.currentClient.policies.map(p => p.insuredPerson).filter(Boolean);
                    return [...new Set(names)];
                },

                get filteredPoliciesByInsured() {
                    if (!this.currentClient || !this.currentClient.policies) return [];
                    if (this.selectedInsuredFilter === 'ALL') return this.currentClient.policies;
                    return this.currentClient.policies.filter(p => p.insuredPerson === this.selectedInsuredFilter);
                },

                createNewClient() {
                    const newId = Date.now().toString();
                    const newC = { id: newId, owner: '新客戶', insured: '新客戶', policies: [] };
                    this.clients.unshift(newC);
                    this.selectedClientId = newId;
                    this.loadSelectedClient();
                },

                addEmptyPolicy() {
                    if (!this.currentClient.policies) this.currentClient.policies = [];
                    this.currentClient.policies.push({
                        insurer: '', policyNumber: '', premium: 0,
                        insuredPerson: this.selectedInsuredFilter !== 'ALL' ? this.selectedInsuredFilter : this.currentClient.owner,
                        items: [{ category: 'CI', name: '', sumAssured: 0, term: '', maturity: '', features: '' }]
                    });
                },

                removePolicy(index) {
                    this.currentClient.policies.splice(index, 1);
                },

                getProductListForCategory(cat) {
                    const sheetName = { 'CI': '危疾保險', 'Life': '人壽保險', 'Medical': '醫療保險', 'Accident': '意外保險', 'Savings': '理財險' }[cat];
                    return this.dbProducts[sheetName] || [];
                },

                onProductSelect(item) {
                    const list = this.getProductListForCategory(item.category);
                    const matched = list.find(p => p.name === item.name);
                    if (matched) {
                        item.features = matched.features;
                    }
                },

                uploadAndParse(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    this.isParsing = true;
                    const reader = new FileReader();

                    reader.onload = (ev) => {
                        const base64Data = ev.target.result.split(',')[1];

                        // 1. 傳送至 AI Engine 2 解析
                        this.postToAi({
                            action: 'parsePolicyDocument',
                            fileData: base64Data,
                            mimeType: file.type
                        })
                        .then(res => {
                            this.isParsing = false;
                            if (res.status === 'success' && res.data) {
                                const p = res.data;
                                if (!this.currentClient.policies) this.currentClient.policies = [];

                                const newItem = {
                                    category: p.category || 'CI',
                                    name: p.productName || '',
                                    sumAssured: Number(p.sumAssured) || 0,
                                    term: p.term || '',
                                    maturity: p.maturity || '',
                                    features: p.features || ''
                                };

                                this.onProductSelect(newItem);

                                this.currentClient.policies.push({
                                    insurer: p.insurer || '',
                                    policyNumber: p.policyNumber || '',
                                    premium: Number(p.premium) || 0,
                                    insuredPerson: p.insuredPerson || this.currentClient.owner,
                                    items: [newItem]
                                });

                                // 2. 解析完成後，自動呼叫 CRM Engine 1 寫回 Google Sheet
                                this.saveCurrentClient();
                                alert('🎉 保單解析成功並已自動寫入 Google Sheet CRM！');
                            } else {
                                alert('解析失敗: ' + (res.message || '請確保 AI 引擎 2 具備 UrlFetchApp 權限'));
                            }
                        })
                        .catch(err => {
                            this.isParsing = false;
                            alert('上載失敗: ' + err.message);
                        });
                    };

                    reader.readAsDataURL(file);
                },

                saveCurrentClient() {
                    this.postToCrm({ action: 'update', payload: this.currentClient })
                    .then(res => {
                        if (res.status === 'success') {
                            this.fetchClients();
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
